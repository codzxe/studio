# =============================================================================
# packages/evals/cases/operations.yaml — golden briefs: resize / variant / export
# intents (§5.5 enum coverage). These run on an existing §24.1-style document.
# =============================================================================

# ── invented seed: resize to story (§5.5 resize intent, §11.1 aspect) ──────────
- id: resize-story
  description: >-
    Invented seed: 9:16 story version of the promo — resize intent with a template
    reapply to instagram-story@1 (smallest path: the story variant template shares the
    slots); quick tier = 1 credit; aspect + safe_area checks guard the new canvas
    (§11.1 aspect: final canvas matches the requested platform spec).
  vars:
    brief: "Cut a 9:16 story version of this post for the launch — same copy, same feel."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 30 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
      assets:
        - { id: asset_812, name: 'latte-hero.jpg', kind: photo }
    catalog:
      templates:
        - id: instagram-story@1
          tags: [promo, social, story]
          canvas: { w: 1080, h: 1920 }
          slots:
            headline: { kind: text, maxChars: 40 }
            subhead: { kind: text, maxChars: 40 }
            photo: { kind: image, minPixels: 800 }
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: resize
      template: instagram-story@1   # story variant shares slots — smallest path (§23.2)
      assets:
        - { ref: asset_812, slot: photo, fit: cover, focal: { x: 0.5, y: 0.4 } }
      slots:
        headline: "Fresh roasted, every morning"
        subhead: "Open 7–5 · Main St"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: { headline: { font: display-serif, weight: bold } }
      steps:
        - { tool: template.apply, args: { id: instagram-story@1 } }
        - { tool: template.fill, args: { keepExistingCopy: true } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', aspect, safe_area]
      model_tier: quick
      notes_for_user: "Rebuilt at 1080x1920 on the story template; copy and photo carried over."
    run:
      status: succeeded
      credits_charged: 1        # quick tier (§5.2)
      tool_calls: 5
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: resize, not a fresh create (§5.5)
      value: "return JSON.parse(output).plan.intent === 'resize'"
    - type: javascript          # template chosen when expected: story variant (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-story@1'"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # expected checks present: aspect + safe_area for the new canvas (§11.1)
      value: "return ['in_bounds', 'aspect', 'safe_area'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # validator results: ok at the new aspect
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0"
    - type: contains            # slot contents carried over verbatim (§21)
      value: "Fresh roasted, every morning"

# ── invented seed: variants via presets (§19 Phase 2 variants) ──────────────────
- id: variant-three-sizes
  description: >-
    Invented seed: three size variants of the promo (square, 9:16 story, 1200x628 link
    ad) keeping copy and look — variant intent via variant presets + layer comps
    (§19 Phase 2 "Variants via data sets + layer comps (sizes, languages)"). Standard
    tier = 2 credits: one planning pass, one batched variant step set.
  vars:
    brief: "Three size variants of the launch promo — square, 9:16 story, and a 1200×628 link ad. Same copy and look."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 30 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 40 }
            subhead: { kind: text, maxChars: 40 }
            photo: { kind: image, minPixels: 600 }
      components: []
    plan:
      intent: variant
      template: instagram-post@3   # variants derive from the applied base template
      assets: []
      slots:
        headline: "Fresh roasted, every morning"
        subhead: "Open 7–5 · Main St"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - tool: variant.create
          args:
            presets: [[1080, 1080], [1080, 1920], [1200, 628]]
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', aspect]
      model_tier: standard
      notes_for_user: "Derived three variants from the base template; copy and palette unchanged."
    run:
      status: succeeded
      credits_charged: 2        # standard tier: one batched variant run (§5.2)
      tool_calls: 6
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: variant, not a resize of the original (§5.5)
      value: "return JSON.parse(output).plan.intent === 'variant'"
    - type: javascript          # template chosen when expected: base template reused (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-post@3'"
    - type: javascript          # exactly the three requested presets (§19 Phase 2)
      value: "const s = JSON.parse(output).plan.steps[0].args.presets; return s.length === 3"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks present: aspect guards every variant (§11.1)
      value: "return ['in_bounds', 'aspect', 'contrast>=4.5'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok across variants
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0"

# ── invented seed: export (§5.5 export intent; §1.5-3 export exception) ─────────
- id: export-bundle-png-pcraft
  description: >-
    Invented seed: export the finished promo as a 2048px PNG plus a .pcraft archive
    copy. Export is the ONLY place flattening is even discussable (§1.5-3) and this
    golden plan never mutates the source document: pure read + export steps, quick
    tier = 1 credit, no undo entry (nothing committed).
  vars:
    brief: "Export this post as a 2048px PNG for the print handoff and save a .pcraft archive copy."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 30 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: []
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: export
      template: null
      assets: []
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - { tool: export.render, args: { format: png, width: 2048 } }
        - { tool: export.save, args: { format: pcraft } }
      checks: [aspect]
      model_tier: quick
      notes_for_user: "Exported a 2048px PNG and saved the layered .pcraft archive; source untouched."
    run:
      status: succeeded
      credits_charged: 1        # quick tier (§5.2); exports also prefer off-peak batch (§5.3)
      tool_calls: 2
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }  # validated before export
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 0           # nothing mutated — no history entry
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: export (§5.5)
      value: "return JSON.parse(output).plan.intent === 'export'"
    - type: javascript          # template not chosen — export never regenerates (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # §1.5-3: export must not flatten/merge/rasterize the source doc
      value: "return JSON.parse(output).plan.steps.every(s => !/flatten|merge|rasterize/i.test(s.tool))"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks present: exported canvas matches the platform spec (§11.1)
      value: "return JSON.parse(output).plan.checks.includes('aspect')"
    - type: javascript          # no mutation: zero undo entries (§5.6)
      value: "return JSON.parse(output).run.undo_entries === 0"
    - type: javascript          # .pcraft archive keeps the layered source (§10 editability)
      value: "return JSON.parse(output).plan.steps.some(s => s.args.format === 'pcraft')"
