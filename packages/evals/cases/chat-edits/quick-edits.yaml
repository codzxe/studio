# =============================================================================
# packages/evals/cases/chat-edits/quick-edits.yaml — the curated chat-edit
# classifier eval set (W7-H): 6 §24.2-style QUICK single-atom edits.
#
# Spec anchors:
#   §19     Phase 2 exit gate: "chat edits correct >= 90% on the curated set"
#           — this directory (20 cases across 5 files) is that curated set.
#   §23.5   the classification contract under test: { action, target_layers,
#           args, cost_tier, needs_template_reapply } — exactly these keys
#           (strict), "pick the cheapest action that satisfies the request".
#   §24.2   the worked quick edit: restyle + add_component, quick tier, 1 credit.
#   §14.1   tier credits: quick 1 / standard 2 / complex 5 (the tier-match
#           assert pins the CREDITS, not the label).
#
# Case shape: userRequest + starting doc state (template pin + layerSummary
# fixture + palette/fonts) + catalog + the golden classification fixture
# (echoed by the deterministic mock provider — same pattern as the golden
# briefs) + expected grading key + the exact assert surface:
#   (1) is-json   — the strict §23.5 key set (chatEditClassificationSchema)
#   (2) action    — atom-set match ("+"-joined composites per §24.2, spaces ok)
#   (3) targets   — expected target_layers is a SUBSET of the classification's
#                   AND every actual target is a real layer in the case's
#                   layerSummary (never-invented rule, §23.5)
#   (4) tier      — credits of cost_tier === expected (1/2/5, §14.1)
#   (5) reapply   — needs_template_reapply === expected (§23.5)
# plus case-specific pins (§24.2 args, corrected copy, catalog refs).
#
# Doc fixture A = the §24.1/§24.2 document state (instagram-post@3 applied,
# filled with the coffee promo): Background/Photo/Headline(88)/Subhead(36).
# =============================================================================

# ── quick edit #1: subhead smaller (restyle atom, §24.2 first half) ───────────
- id: ce-quick-subhead-smaller
  description: >-
    §24.2 first half verbatim ("Make the subhead smaller."): single restyle atom
    targeting Subhead, 36 -> 30pt per the §24.2 trace; quick tier = 1 credit;
    no template reapply — a targeted edit never regenerates (§23.5).
  vars:
    userRequest: "Make the subhead smaller."
    doc:
      template: instagram-post@3          # starting doc: the §24.1 coffee promo
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 36, text: 'Open 7–5 · Main St' }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components: []
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    classification:                        # golden §23.5 output (mock provider echoes)
      action: restyle
      target_layers: [Subhead]
      args: { size: 30 }                   # §24.2: type.edit Subhead 36 -> 30pt
      cost_tier: quick
      needs_template_reapply: false
    expected:                              # grading key (mirrors the asserts below)
      action: restyle
      target_layers: [Subhead]            # subset of classification.target_layers
      cost_tier: quick
      credits: 1                           # §14.1 price of cost_tier
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: exactly the restyle atom (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('restyle'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # target_layers subset: Subhead named, nothing invented (§23.5)
      value: "return ((t) => t.includes('Subhead') && t.every((x) => ['Background','Photo','Headline','Subhead'].includes(x)))(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (quick = 1)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match — targeted restyle only (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # §24.2 trace pin: subhead 36 -> 30pt
      value: "return JSON.parse(output).args.size === 30"

# ── quick edit #2: add a 20% OFF badge (add_component atom, §24.2 second half) ──
- id: ce-quick-add-badge
  description: >-
    §24.2 second half alone ("add a 20% OFF badge"): add_component places the
    catalog component offer-badge@2 with vars{label:"20% OFF"} top-right; no
    target layer (the layer does not exist yet — naming one would be an
    invented target, §23.5); quick tier = 1 credit; no reapply.
  vars:
    userRequest: "Add a 20% OFF badge in the top-right corner."
    doc:
      template: instagram-post@3
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 36, text: 'Open 7–5 · Main St' }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components:
        - { id: offer-badge@2, version: 2, variables: [label, bg, textColor, showRibbon] }
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    classification:
      action: add_component
      target_layers: []                    # the Badge layer does not exist yet
      args: { component: 'offer-badge@2', vars: { label: '20% OFF' }, anchor: 'topRight' }
      cost_tier: quick
      needs_template_reapply: false
    expected:
      action: add_component
      target_layers: []                   # no subset requirement — nothing to target
      cost_tier: quick
      credits: 1
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: exactly the add_component atom (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('add_component'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # add_component invents no pre-existing target (§23.5)
      value: "return JSON.parse(output).target_layers.length === 0"
    - type: javascript          # tier match: §14.1 credits of cost_tier (quick = 1)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # component pin: catalog component + §24.2 label var
      value: "return ((a) => a.component === 'offer-badge@2' && a.vars.label === '20% OFF')(JSON.parse(output).args)"
    - type: contains            # §24.2 badge copy rides the classification (§21 slot-content assert)
      value: "20% OFF"

