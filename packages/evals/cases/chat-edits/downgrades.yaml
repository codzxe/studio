# =============================================================================
# packages/evals/cases/chat-edits/downgrades.yaml — the curated chat-edit
# classifier eval set (W7-H): 3 DOWNGRADE TRAPS.
#
# Spec anchors:
#   §23.5   "Pick the cheapest action that satisfies the request… Never
#           propose a full regeneration when a targeted edit works."
#   §5.2    the deterministic tier guard (resolveCostTier in
#           packages/agent/src/classifier/classifier.ts) RESOLVES the
#           model's proposal: heavier proposals are downgraded with a
#           warning; the run charges the RESOLVED tier (§14.1 credits).
#
# Trap shape: the utterance SOUNDS like a regeneration/brand-wide/standard
# ask ("completely redo", "everywhere it appears", "rebrand the whole
# cover") — a naive model proposes complex (5 credits). The CORRECT
# classification is a single targeted atom at QUICK = 1 credit, and these
# cases assert the resolved tier. The `trap` var documents the naive answer
# (it is NOT graded); the exact-set target assert gives the case teeth: an
# over-broad spray (more targets than the ask justifies) fails, and so does
# an invented tier once a real-model provider is wired.
#
# Provider note: the graded `cost_tier` is the RESOLVED tier (the guard
# output), matching production charging — see README.md.
# =============================================================================

# ── trap #1: "completely redo" is one headline swap ─────────────────────────
- id: ce-trap-full-redo
  description: >-
    "Completely redo this promo — new headline…": regeneration language, but
    the ask pins exactly one change. Naive instinct: complex (5 credits,
    reapply). Correct: set_text on Headline only, quick = 1 credit,
    needs_template_reapply FALSE (§23.5: never a full regeneration when a
    targeted edit works; the guard downgrades a complex proposal with a
    warning). Exact target set — anything beyond Headline fails.
  vars:
    userRequest: "Completely redo this promo — new headline: 'Summer Street Fair', keep everything else."
    doc:
      template: instagram-post@3
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 36, text: 'Open 7–5 · Main St' }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components: []
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    trap:                                  # documentation only — NOT graded
      naive_cost_tier: complex
      reason: "'completely redo' sounds like regeneration; §23.5 forbids it when a targeted edit works"
    classification:                        # golden §23.5 output — RESOLVED tier (mock echoes)
      action: set_text
      target_layers: [Headline]
      args: { text: 'Summer Street Fair' }   # 18 chars, inside the 42-char slot cap (§23.2)
      cost_tier: quick                     # downgraded by the §23.5 cheapest-action guard
      needs_template_reapply: false
    expected:
      action: set_text
      target_layers: [Headline]
      cost_tier: quick
      credits: 1                           # §14.1 price of the RESOLVED tier
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: exactly the set_text atom — no regeneration (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('set_text'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # EXACT target set: Headline and nothing else — no spray
      value: "return ((t) => t.length === 1 && t[0] === 'Headline')(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: the trap — §14.1 credits of the RESOLVED tier = 1
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match — FALSE: no regeneration (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # the pinned headline copy rides args (§23.2 slot cap 42)
      value: "return ((t) => t === 'Summer Street Fair' && t.length <= 42)(JSON.parse(output).args.text)"

# ── trap #2: "everywhere it appears" is one date layer ────────────────────────
- id: ce-trap-date-everywhere
  description: >-
    "Update the date to June 12 everywhere it appears": "everywhere" tempts a
    multi-target/standard answer, but the event-flyer carries the date on
    exactly ONE layer ("Subhead — Date"; the venue/footer lines carry no
    date). Correct: set_text on that layer, quick = 1 credit, no reapply.
    Exact target set — anything beyond the date layer fails.
  vars:
    userRequest: "Update the date to June 12 everywhere it appears."
    doc:
      template: event-flyer@1
      canvas: { w: 1748, h: 2480 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_815, bounds: [150, 150, 1448, 980] }
        - { name: Footer Strip, kind: fill, fill: '#D96C3B', opacity: 100 }
        - { name: Content, kind: group }
        - { name: Headline, kind: text, size: 140, text: 'Summer Street Fair' }
        - { name: 'Subhead — Date', kind: text, size: 64, text: 'Sat 10–6' }
        - { name: 'Body — Venue', kind: text, size: 64, text: 'Main Street Plaza' }
        - { name: 'Caption — Footer', kind: text, size: 60, text: 'Coffee · Beats · Local Makers' }
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: event-flyer@1 }]
      components: []
      assets: [{ id: asset_815, name: 'street-fair.jpg', kind: photo }]
    trap:                                  # documentation only — NOT graded
      naive_cost_tier: complex
      reason: "'everywhere it appears' sounds like a multi-site rewrite; the date lives on one layer"
    classification:
      action: set_text
      target_layers: ['Subhead — Date']
      args: { text: 'June 12' }            # 7 chars, inside the 36-char slot cap (§23.2)
      cost_tier: quick                     # downgraded by the §23.5 cheapest-action guard
      needs_template_reapply: false
    expected:
      action: set_text
      target_layers: ['Subhead — Date']
      cost_tier: quick
      credits: 1
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: exactly the set_text atom (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('set_text'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # EXACT target set: the one date layer, nothing else
      value: "return ((t) => t.length === 1 && t[0] === 'Subhead — Date')(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: the trap — §14.1 credits of the RESOLVED tier = 1
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # the new date content rides args (lenient on formatting, firm on content)
      value: "return ((t) => typeof t === 'string' && t.includes('June 12') && t.length <= 36)(JSON.parse(output).args.text)"

# ── trap #3: "rebrand the whole cover" is one headline recolor ────────────────
- id: ce-trap-rebrand-cover
  description: >-
    "Rebrand the whole cover — headline in the terracotta brand color":
    "rebrand the whole cover" tempts a complex multi-layer restyle (or even a
    template reapply), but the ask pins ONE layer and ONE palette token.
    Correct: recolor on Headline, quick = 1 credit, needs_template_reapply
    FALSE. #D96C3B is a facebook-cover@1 palette token (§23.2 — never an
    invented colour). Exact target set — anything beyond Headline fails.
  vars:
    userRequest: "Rebrand the whole cover — headline in the terracotta brand color."
    doc:
      template: facebook-cover@1
      canvas: { w: 820, h: 312 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#101418', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_814, bounds: [0, 0, 820, 312] }
        - { name: Headline, kind: text, size: 60, fill: '#FFFFFF', text: 'Small batch, big mornings' }
        - { name: Logo, kind: smart_object, asset: asset_201, bounds: [48, 48, 64, 64] }
      palette: ['#101418', '#FFFFFF', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: facebook-cover@1 }]
      components: []
      assets:
        - { id: asset_814, name: 'roastery-cover.jpg', kind: photo }
        - { id: asset_201, name: 'logo-dark.png', kind: logo }
    trap:                                  # documentation only — NOT graded
      naive_cost_tier: complex
      reason: "'rebrand the whole cover' sounds like a full restyle; the ask pins one layer + one palette token"
    classification:
      action: recolor
      target_layers: [Headline]
      args: { fill: '#D96C3B' }           # facebook-cover palette token (§23.2)
      cost_tier: quick                     # downgraded by the §23.5 cheapest-action guard
      needs_template_reapply: false
    expected:
      action: recolor
      target_layers: [Headline]
      cost_tier: quick
      credits: 1
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: exactly the recolor atom — no rebrand storm (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('recolor'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # EXACT target set: Headline and nothing else
      value: "return ((t) => t.length === 1 && t[0] === 'Headline')(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: the trap — §14.1 credits of the RESOLVED tier = 1
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match — FALSE (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # §23.2: the colour is a cover palette token, never invented
      value: "return ((f) => f === '#D96C3B' && ['#101418','#FFFFFF','#D96C3B'].includes(f))(JSON.parse(output).args.fill)"
