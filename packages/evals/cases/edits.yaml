      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: { headline: { font: display-serif, weight: bold, size: 88 } }
      steps:
        - { tool: type.edit, args: { layer: Headline, text: 'Roasted this morning' } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest]
