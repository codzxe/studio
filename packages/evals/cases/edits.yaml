    catalog:
      templates: []
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: edit_layers
      template: null
      assets:
        - { ref: asset_202, slot: logo, fit: contain }
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - { tool: doc.place, args: { asset: asset_202, layer: Logo, replace: true } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', asset_resolution]
      model_tier: quick
      notes_for_user: "Swapped the logo smart object in place; size and position preserved."
    run:
      status: succeeded
      credits_charged: 1
      tool_calls: 4
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Logo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # template not chosen — in-place swap only (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # §23.2: asset id EXISTS in SNAPSHOT (asset_202, never invented)
      value: "return JSON.parse(output).plan.assets[0].ref === 'asset_202' && JSON.parse(output).plan.assets[0].slot === 'logo'"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
