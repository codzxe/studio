# =============================================================================
# packages/evals/cases/edits.yaml — golden briefs: edit_layers intents (§5.5).
# Chat-edit cases are quick tier (§5.2: 1 credit, 6 tool calls) — a targeted edit
# must never become a regeneration (§23.5 classifier policy).
# =============================================================================

# ── §24.2 seed (verbatim) ─────────────────────────────────────────────────────
- id: chat-edit-subhead-badge
  description: >-
    §24.2 verbatim — chat edit on the §24.1 document: classifier maps to restyle +
    add_component targeting Subhead; subhead 36 -> 30pt, offer-badge@2 placed top-right
    with label "20% OFF"; quick tier = 1 credit (§5.2/§24.2); undo restores both
    changes in ONE step (§1.5-10).
  vars:
    brief: "Make the subhead smaller and add a 20% OFF badge."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 36 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: []
      components:
        - { id: offer-badge@2, vars: [label] }
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: edit_layers
      template: null            # targeted edit — no template reapply (§23.5)
      assets: []
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: { subhead: { font: brand-sans, size: 30 } }
      steps:
        - { tool: type.edit, args: { layer: Subhead, size: 30 } }
        - { tool: component.place, args: { id: offer-badge@2, vars: { label: '20% OFF' } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5']
      model_tier: quick
      notes_for_user: "Subhead down to 30pt and a 20% OFF badge added top-right; both undoable in one step."
    run:
      status: succeeded
      credits_charged: 1        # §5.2 quick tier; §24.2 "charge 1 credit"
      tool_calls: 5
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, Badge]  # 1 changed + 1 added layer (§24.2)
      undo_entries: 1           # §24.2: undo restores both in one step
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # targeted edit: no template chosen / no reapply (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # §24.2 trace: Subhead 36 -> 30pt
      value: "return JSON.parse(output).plan.steps[0].args.size === 30 && JSON.parse(output).plan.steps[0].args.layer === 'Subhead'"
    - type: javascript          # §24.2: offer-badge@2 with label var "20% OFF"
      value: "return JSON.parse(output).plan.steps[1].tool === 'component.place' && JSON.parse(output).plan.steps[1].args.vars.label === '20% OFF'"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks present
      value: "return ['in_bounds', 'contrast>=4.5'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1): ok, no blockers
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0 && v.majors === 0"
    - type: javascript          # layer names: Badge added, role naming kept (§23.1 rule 5)
      value: "return JSON.parse(output).run.layers.includes('Badge') && JSON.parse(output).run.layers.includes('Subhead')"
    - type: javascript          # one transaction per run (§1.5-10, §24.2 one-step undo)
      value: "return JSON.parse(output).run.undo_entries === 1"
    - type: contains            # slot content: badge label copy (§24.2)
      value: "20% OFF"

# ── invented seed: quick text swap (§11.4 edit family) ─────────────────────────
