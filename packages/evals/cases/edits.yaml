      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # template not chosen — targeted swap only (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # slot contents: exact new headline (§21)
      value: "return JSON.parse(output).plan.slots.headline === 'Roasted this morning'"
    - type: javascript          # §23.2 maxChars rule: copy stays within the 40-char slot budget
      value: "return JSON.parse(output).plan.slots.headline.length <= 40"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks present
      value: "return ['contrast>=4.5', 'headline_largest'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok, no blockers
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0"
    - type: contains            # layer names: Headline retargeted, role naming kept
      value: "Headline"

