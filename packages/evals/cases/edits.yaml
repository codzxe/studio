  description: >-
    Invented seed: swap in the newly uploaded logo (asset_202) at the same spot/size.
    The planner may only reference asset ids present in SNAPSHOT (§23.2), must keep the
    role name "Logo" (§23.1 rule 5), and must not touch anything else; quick tier.
  vars:
    brief: "Swap in the new logo asset on this layout — same spot, same size."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Logo, kind: smart_object, asset: asset_201 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 30 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
      assets:
        - { id: asset_201, name: 'logo-old.png', kind: logo }
