# ── invented seed: template swap with reapply (§5.5 edit_layers + template) ────
- id: template-swap-flyer
  description: >-
    Invented seed: rebuild the promo on the event-flyer layout, keeping copy and
    colours. Template reapply is heavier than a quick edit, so the planner routes it to
    the standard tier (2 credits, §5.2). Copy slots are preserved verbatim; the two new
    flyer slots (date/venue) get reasonable fills and the planner states the assumption
    (§23.1 rule 10 / §5.5 notes_for_user).
  vars:
    brief: "Rebuild this promo on the event-flyer layout for the street fair — keep the copy and the colors."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 30 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
      assets:
        - { id: asset_812, name: 'latte-hero.jpg', kind: photo }
    catalog:
      templates:
        - id: event-flyer@3
          tags: [flyer, event, portrait]
          canvas: { w: 1080, h: 1350 }
          slots:
            headline: { kind: text, maxChars: 40 }
            subhead: { kind: text, maxChars: 60 }
            photo: { kind: image, minPixels: 600 }
            date: { kind: text, maxChars: 24 }
            venue: { kind: text, maxChars: 30 }
      components: []
    plan:
      intent: edit_layers
      template: event-flyer@3   # reapply requested by the brief (§5.5 template field)
      assets:
        - { ref: asset_812, slot: photo, fit: cover }
      slots:
        headline: "Fresh roasted, every morning"
        subhead: "Open 7–5 · Main St"
        date: "Sat 9–5"
        venue: "Main Street"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: { headline: { font: display-serif, weight: bold } }
      steps:
        - { tool: template.apply, args: { id: event-flyer@3 } }
        - { tool: template.fill, args: { keepExistingCopy: true } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area]
      model_tier: standard
      notes_for_user: "Kept your copy and palette; filled date and venue from the shop hours — adjust if wrong."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier (template reapply + refill)
      tool_calls: 7
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, Date, Venue]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # template chosen when expected: flyer picked for the reapply
      value: "return JSON.parse(output).plan.template === 'event-flyer@3'"
    - type: javascript          # §5.5: assumption stated to the user (date/venue invented)
      value: "return JSON.parse(output).plan.notes_for_user.length > 0"
    - type: javascript          # slot contents: original copy preserved verbatim (§21)
      value: "return JSON.parse(output).plan.slots.headline === 'Fresh roasted, every morning' && JSON.parse(output).plan.slots.subhead === 'Open 7–5 · Main St'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks present
      value: "return ['in_bounds', 'contrast>=4.5', 'headline_largest', 'safe_area'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok, no blockers after reapply
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0"
    - type: contains            # layer names: flyer slot layers use role names (§23.1 rule 5)
      value: "Venue"
