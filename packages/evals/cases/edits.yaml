    - type: javascript          # expected checks present (placed image meets slot minPixels, §11.1)
      value: "return ['in_bounds', 'asset_resolution'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok after the swap
      value: "const v = JSON.parse(output).run.validator; return v.ok === true && v.blockers === 0"
