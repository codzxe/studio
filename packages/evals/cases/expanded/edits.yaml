      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"
    - type: contains            # slot content: the new CTA copy (§21)
      value: "Save my seat"

# ── heavier edit #7: multi-target restyle routes UP to standard (§23.5) ───────
- id: edit-std-ribbon-restyle
  description: >-
    Multi-target restyle on the prepared grand-opening doc (three simultaneous asks:
    ribbon colour, wave flip, headline retype) — too broad for the quick tier, so the
    golden classifier routes it UP to standard (§5.2: 2 credits, 12-call cap); still
    edit_layers, still no template reapply (§23.5).
  vars:
    brief: "Make the ribbon the deep brown, flip the wave divider, and retitle the headline to 'Now open Sundays'."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_781 }
        - { name: Headline, kind: text, size: 88, text: "We're open on 5th Ave" }
        - { name: Subhead, kind: text, size: 36 }
        - { name: Wave, kind: component, component: wave-divider@1, color: '#D96C3B', flip: false }
        - { name: Lockup, kind: component, component: logo-lockup@1, name: 'Acme Coffee' }
        - { name: Ribbon, kind: component, component: ribbon-banner@1, label: 'GRAND OPENING', bg: '#D96C3B' }
        - { name: Handle, kind: component, component: social-handle@1, handle: '@acme.coffee' }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: []
      components:
        - { id: ribbon-banner@1, vars: [label, bg, textColor, corner] }
        - { id: wave-divider@1, vars: [color, flip] }
    plan:
      intent: edit_layers
      template: null            # restyle, not a reapply (§23.5)
      assets: []
      slots:
        headline: "Now open Sundays"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography:
        headline: { font: display-serif, weight: bold, size: 88 }
      steps:
        - { tool: component.setVars, args: { instance: Ribbon, vars: { bg: '#6B4A32' } } }
        - { tool: component.setVars, args: { instance: Wave, vars: { flip: true } } }
        - { tool: type.edit, args: { layer: Headline, text: 'Now open Sundays' } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest]
      model_tier: standard       # three simultaneous targets — up-tiered (§5.2)
      notes_for_user: "Ribbon is deep brown, wave flipped, headline now 'Now open Sundays'."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier (multi-target restyle)
      tool_calls: 6
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, Wave, Lockup, Ribbon, Handle]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # targeted edit: no template chosen (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # all three asks answered: ribbon token, wave flip, retype
      value: "return JSON.parse(output).plan.steps.some(s => s.args.instance === 'Ribbon' && s.args.vars.bg === '#6B4A32') && JSON.parse(output).plan.steps.some(s => s.args.instance === 'Wave' && s.args.vars.flip === true) && JSON.parse(output).plan.slots.headline === 'Now open Sundays'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks present
      value: "return ['in_bounds', 'contrast>=4.5', 'headline_largest'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"
    - type: javascript          # §11.1 palette discipline: deep brown is a brand token
      value: "return ((brand) => JSON.parse(output).plan.palette.every(h => brand.includes(h)))(['#6B4A32', '#F4E7D3', '#D96C3B'])"

# ── heavier edit #8: visual swap + retype on a prepared slide ─────────────────
- id: edit-std-visual-swap
  description: >-
    Standard-tier edit on the prepared quarterly slide: swap the chart smart object
    to the freshly uploaded beta screenshot (asset_921 — exists in SNAPSHOT, §23.2
    asset-id discipline) and retype the subtitle; still edit_layers, no reapply.
  vars:
    brief: "Replace the chart with the new beta screenshot that I uploaded today, and update the subtitle to 'Self-serve, live in beta'."
    snapshot:
      canvas: { w: 1920, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Title, kind: text, size: 72 }
        - { name: Subtitle, kind: text, size: 36, text: 'ARR +38% YoY' }
        - { name: Visual, kind: smart_object, asset: asset_901 }
        - { name: Logo, kind: smart_object, asset: asset_902 }
      palette: ['#F6F5F2', '#1A1A1A', '#52504B']
      fonts: ['display-sans', 'brand-sans']
      assets:
        - { id: asset_901, name: 'q3-arr-chart.png', kind: chart }
        - { id: asset_921, name: 'beta-dashboard.png', kind: screenshot }
        - { id: asset_902, name: 'logo.png', kind: logo }
    catalog:
      templates: []
      components: []
    plan:
      intent: edit_layers
      template: null            # targeted swap, no reapply (§23.5)
      assets:
        - { ref: asset_921, slot: visual, fit: cover, focal: { x: 0.5, y: 0.5 } }
      slots:
        subtitle: "Self-serve, live in beta"
      palette: ['#F6F5F2', '#1A1A1A', '#52504B']
      typography: {}
      steps:
        - { tool: doc.place, args: { asset: asset_921, layer: Visual, replace: true, fit: cover } }
        - { tool: type.edit, args: { layer: Subtitle, text: 'Self-serve, live in beta' } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', asset_resolution]
      model_tier: standard
      notes_for_user: "Visual swapped to the beta screenshot and subtitle updated; logo and title untouched."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier (asset swap + retype)
      tool_calls: 5
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Title, Subtitle, Visual, Logo]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # targeted edit: no template chosen (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # §23.2 asset-id discipline: asset_921 exists in SNAPSHOT
      value: "return JSON.parse(output).plan.assets[0].ref === 'asset_921' && JSON.parse(output).plan.assets[0].slot === 'visual'"
    - type: javascript          # in-place swap keeps the role name (§23.1 rule 5)
      value: "return JSON.parse(output).plan.steps[0].tool === 'doc.place' && JSON.parse(output).plan.steps[0].args.layer === 'Visual' && JSON.parse(output).plan.steps[0].args.replace === true"
    - type: javascript          # subtitle retype verbatim (§21)
      value: "return JSON.parse(output).plan.slots.subtitle === 'Self-serve, live in beta'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks present (asset_resolution guards the swap, §11.1)
      value: "return ['in_bounds', 'contrast>=4.5', 'asset_resolution'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"
