# =============================================================================
# packages/evals/cases/expanded/edits.yaml — golden briefs: edit_layers intents
# (W7-D growth wave).
#
# (c) intent matrix row edit_layers x8 — ALL on PREPARED documents (full layer
#     trees in snapshot, §19 Phase 2 "multi-turn chat edits on a document").
# (d) quick-tier targeted edits x6 in §24.2 style: one restyle + one
#     add_component/set_var move, 1 credit, 6-call cap, "a targeted edit must
#     never become a regeneration" (§23.5). The two heavier cases (multi-target
#     restyle, asset swap + retype) route to the standard tier (2 credits).
#
# Component coverage rides the set_vars surface (§8.3 component.setVars) against
# the ACTUAL component manifests in evals/components/.
# =============================================================================

# ── quick targeted edit #1: price-tag setVars (§24.2 style) ───────────────────
- id: edit-quick-price-eur
  description: >-
    §24.2-style quick edit on the prepared flash-sale doc: change the price-tag@1
    instance to 14.50 with a EUR currency — component.setVars only (§8.3), no
    template reapply, quick tier = 1 credit, 4 tool calls, undo in ONE step (§1.5-10).
  vars:
    brief: "Change the price on the tag to 14,50 €."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_755 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 36 }
        - { name: PriceTag, kind: component, component: price-tag@1, price: '18.00', currency: '$' }
        - { name: Button, kind: component, component: button-cta@1, label: 'Shop now' }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: []
      components:
        - { id: price-tag@1, vars: [price, currency, bg, textColor] }
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: edit_layers
      template: null            # targeted edit — no reapply (§23.5)
      assets: []
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - { tool: component.setVars, args: { instance: PriceTag, vars: { price: '14.50', currency: '€' } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5']
      model_tier: quick
      notes_for_user: "Tag now reads 14.50 €; nothing else touched, one-step undo."
    run:
      status: succeeded
      credits_charged: 1        # §5.2 quick tier
      tool_calls: 4
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, PriceTag, Button]
      undo_entries: 1           # one transaction (§1.5-10)
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'edit_layers'"
    - type: javascript          # targeted edit: no template chosen (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # setVars carries the exact price/currency (§8.3)
      value: "return JSON.parse(output).plan.steps[0].tool === 'component.setVars' && JSON.parse(output).plan.steps[0].args.instance === 'PriceTag' && JSON.parse(output).plan.steps[0].args.vars.price === '14.50' && JSON.parse(output).plan.steps[0].args.vars.currency === '€'"
    - type: javascript          # §8.2 caps: price 10 chars, currency 3 chars
      value: "return JSON.parse(output).plan.steps[0].args.vars.price.length <= 10 && JSON.parse(output).plan.steps[0].args.vars.currency.length <= 3"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks present
      value: "return ['in_bounds', 'contrast>=4.5'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"
    - type: javascript          # one-step undo (§1.5-10)
      value: "return JSON.parse(output).run.undo_entries === 1"

