# =============================================================================
# packages/evals/cases/expanded/operations.yaml — golden briefs: resize /
# variant / export intents (W7-D growth wave; §5.5 intent enum coverage).
#
# (c) intent matrix rows: resize x3, variant x4 (languages AND sizes, §19 Phase 2
#     "Variants via data sets + layer comps"), export x3.
# Resize reapply precedent: quick tier per the Wave-1 resize-story seed; the
# print-flyer case adds bleed/safe-margin work and routes to standard.
# Export never mutates the document: zero undo entries, no flatten/merge steps
# (§1.5-3 export exception, §5.6).
# =============================================================================

# ── resize #1: 16:9 thumbnail -> square community post via template reapply ──
- id: resize-thumb-to-square
  description: >-
    Resize the 1280x720 episode thumbnail to a 1080x1080 square community post:
    smallest path is a template reapply of the ACTUAL instagram-post@3 (square)
    carrying the same headline + photo; quick tier = 1 credit (§5.2, Wave-1
    resize-story precedent); aspect + safe_area guard the new canvas (§11.1).
  vars:
    brief: "Make a square 1080×1080 community-post version of this thumbnail — same headline, same photo."
    snapshot:
      canvas: { w: 1280, h: 720 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_733 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Badge, kind: component, component: offer-badge@2, label: NEW }
      palette: ['#101418', '#FFFFFF', '#E5484D']
      fonts: ['display-sans', 'brand-sans']
      assets:
        - { id: asset_733, name: 'tent-ridge.jpg', kind: photo }
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 42 }
            subhead: { kind: text, maxChars: 60 }
            photo: { kind: image, minPixels: 600 }
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: resize
      template: instagram-post@3   # square target — smallest path (§23.2)
      assets:
        - { ref: asset_733, slot: photo, fit: cover, focal: { x: 0.5, y: 0.35 } }
      slots:
        headline: "WE TESTED 12 TENTS"
      palette: ['#101418', '#FFFFFF', '#E5484D']
      typography:
        headline: { font: display-sans, weight: bold, size: 88 }
      steps:
        - { tool: template.apply, args: { id: instagram-post@3 } }
        - { tool: template.fill, args: { keepExistingCopy: true } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', aspect, safe_area]
      model_tier: quick
      notes_for_user: "Rebuilt at 1080x1080 on instagram-post@3; headline and photo carried over."
    run:
      status: succeeded
      credits_charged: 1        # §5.2 quick tier (resize precedent)
      tool_calls: 5
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: resize, not a fresh create (§5.5)
      value: "return JSON.parse(output).plan.intent === 'resize'"
    - type: javascript          # template chosen when expected: square target (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-post@3'"
    - type: javascript          # copy carried over verbatim (§21)
      value: "return JSON.parse(output).plan.slots.headline === 'WE TESTED 12 TENTS'"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks: aspect + safe_area for the new canvas (§11.1)
      value: "return ['in_bounds', 'aspect', 'safe_area'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok at the new aspect
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── resize #2: slide -> 1200x628 link-ad crop, template-free refit ────────────
- id: resize-slide-web-banner
  description: >-
    Resize the keynote slide to a 1200x628 link-ad canvas: no catalog template fits,
    so the golden plan re-lays-out the SAME layers declaratively (layout.apply +
    type refits, §9 constraints-not-coordinates) instead of reapplying a template;
    quick tier = 1 credit; the plan sits exactly at the 6-call cap.
  vars:
    brief: "Crop this slide into a 1200×628 link-ad canvas for the campaign — keep the title readable."
    snapshot:
      canvas: { w: 1920, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Title, kind: text, size: 72 }
        - { name: Subtitle, kind: text, size: 36 }
        - { name: Visual, kind: smart_object, asset: asset_957 }
        - { name: Logo, kind: smart_object, asset: asset_902 }
      palette: ['#F6F5F2', '#1A1A1A', '#52504B']
      fonts: ['display-sans', 'brand-sans']
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 42 }
        - id: youtube-thumbnail@1
          tags: [social, video, thumbnail, wide]
          canvas: { w: 1280, h: 720 }
          slots:
            headline: { kind: text, maxChars: 30 }
        - id: presentation-slide@1
          tags: [presentation, slide, 16x9]
          canvas: { w: 1920, h: 1080 }
          slots:
            title: { kind: text, maxChars: 48 }
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: resize
      template: null            # no template at 1200x628 — declarative refit (§9)
      assets: []
      slots: {}
      palette: ['#F6F5F2', '#1A1A1A', '#52504B']
      typography:
        title: { font: display-sans, weight: bold, size: 64 }
        subtitle: { font: brand-sans, size: 30 }
      steps:
        - { tool: layout.apply, args: { canvas: { w: 1200, h: 628 }, stack: centered, padding: 48 } }
        - { tool: type.edit, args: { layer: Title, size: 64 } }
        - { tool: type.edit, args: { layer: Subtitle, size: 30 } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', aspect, safe_area, min_font_size]
      model_tier: quick
      notes_for_user: "Re-laid-out at 1200x628 with the title scaled to 64pt; visual cropped by the layout."
    run:
      status: succeeded
      credits_charged: 1        # §5.2 quick tier
      tool_calls: 6             # exactly at the quick cap — inside budget
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Title, Subtitle, Visual, Logo]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: resize (§5.5)
      value: "return JSON.parse(output).plan.intent === 'resize'"
    - type: javascript          # no template forced — declarative refit is correct (§9/§23.2)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # target canvas is declared in the layout step (§9)
      value: "return JSON.parse(output).plan.steps[0].tool === 'layout.apply' && JSON.parse(output).plan.steps[0].args.canvas.w === 1200 && JSON.parse(output).plan.steps[0].args.canvas.h === 628"
    - type: javascript          # title refitted down for readability at the smaller canvas
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'type.edit' && s.args.layer === 'Title' && s.args.size === 64)"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6) — at the cap, not over
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # expected checks: aspect + min_font_size for the crop (§11.1)
      value: "return ['in_bounds', 'aspect', 'safe_area', 'min_font_size'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── resize #3: square post -> A5 portrait print (standard; print margins) ─────
- id: resize-a5-print-flyer
  description: >-
    A5 portrait print version of the square promo: 1748x2480 at 300dpi with 3mm-safe
    margins between text and trim. Print adds bleed/safe work beyond a social resize,
    so the golden classifier routes to standard (2 credits, 12-call cap); template
    stays null — declarative restack, no 1748x2480 catalog template exists.
  vars:
    brief: "Make an A5 portrait print version of this post — 1748×2480 at 300 dpi, and keep all text at least 3mm away from the trim."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 36 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
      assets:
        - { id: asset_812, name: 'latte-hero.jpg', kind: photo }
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 42 }
        - id: presentation-slide@1
          tags: [presentation, slide, 16x9]
          canvas: { w: 1920, h: 1080 }
          slots:
            title: { kind: text, maxChars: 48 }
      components: []
    plan:
      intent: resize
      template: null            # no print-size template — declarative restack (§9)
      assets:
        - { ref: asset_812, slot: photo, fit: cover, focal: { x: 0.5, y: 0.3 } }
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography:
        headline: { font: display-serif, weight: bold, size: 180 }
        subhead: { font: brand-sans, size: 64 }
      steps:
        - { tool: layout.apply, args: { canvas: { w: 1748, h: 2480 }, stack: centered, padding: 210 } }
        - { tool: doc.place, args: { asset: asset_812, layer: Photo, fit: cover, focalY: 0.3 } }
        - { tool: type.edit, args: { layer: Headline, size: 180 } }
        - { tool: type.edit, args: { layer: Subhead, size: 64 } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', aspect, safe_area, min_font_size, asset_resolution]
      model_tier: standard       # print margins + upscaled assets = standard work (§5.2)
      notes_for_user: "Rebuilt at 1748x2480 with 210px inner padding (~3mm at 300dpi); photo re-covered for the tall crop."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 7
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: resize (§5.5)
      value: "return JSON.parse(output).plan.intent === 'resize'"
    - type: javascript          # no template forced (§23.2)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # A5 @300dpi canvas + safe padding declared (§9)
      value: "return JSON.parse(output).plan.steps[0].args.canvas.w === 1748 && JSON.parse(output).plan.steps[0].args.canvas.h === 2480 && JSON.parse(output).plan.steps[0].args.padding === 210"
    - type: javascript          # type scaled up for print legibility (§11.1 min_font_size)
      value: "return JSON.parse(output).plan.steps.some(s => s.args.layer === 'Headline' && s.args.size === 180) && JSON.parse(output).plan.steps.some(s => s.args.layer === 'Subhead' && s.args.size === 64)"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks: print-safe set (§11.1)
      value: "return ['in_bounds', 'aspect', 'safe_area', 'min_font_size', 'asset_resolution'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── variant #1: three-language data sets (de/fr/es) ───────────────────────────
- id: variant-languages-de-fr-es
  description: >-
    §19 Phase 2 language variants: the same promo as DE/FR/ES data-set variants via
    variant.create (§8.1 variables + data sets) — one batched standard-tier run
    (2 credits); translated copy stays inside the 42/60-char slot caps.
  vars:
    brief: "Give me this promo in German, French and Spanish — same layout, translated copy, as variants."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88 }
        - { name: Subhead, kind: text, size: 36 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 42 }
            subhead: { kind: text, maxChars: 60 }
            photo: { kind: image, minPixels: 600 }
      components: []
    plan:
      intent: variant
      template: instagram-post@3   # variants derive from the applied base template
      assets: []
      slots:
        headline: "Fresh roasted, every morning"
        subhead: "Open 7–5 · Main St"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - tool: variant.create
          args:
            datasets:
              - { lang: de, headline: 'Frisch geröstet, jeden Morgen', subhead: 'Mo–Fr 7–17 Uhr · Hauptstraße' }
              - { lang: fr, headline: 'Grillé frais, chaque matin', subhead: 'Lun–Ven 7–17 h · rue Principale' }
              - { lang: es, headline: 'Tostado fresco, cada mañana', subhead: 'Lun–Vie 7–17 h · calle Mayor' }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, text_overflow]
      model_tier: standard
      notes_for_user: "Three translated data-set variants on the same layout; EN master untouched."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier: one batched variant run
      tool_calls: 4
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: variant, not a resize (§5.5)
      value: "return JSON.parse(output).plan.intent === 'variant'"
    - type: javascript          # base template reused (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-post@3'"
    - type: javascript          # exactly the three requested languages
      value: "return ((ds) => ds.length === 3 && ds[0].lang === 'de' && ds[1].lang === 'fr' && ds[2].lang === 'es')(JSON.parse(output).plan.steps[0].args.datasets)"
    - type: javascript          # every translated headline fits the 42-char slot cap (§7.3)
      value: "return JSON.parse(output).plan.steps[0].args.datasets.every(d => d.headline.length <= 42)"
    - type: javascript          # every translated subhead fits the 60-char cap (§7.3)
      value: "return JSON.parse(output).plan.steps[0].args.datasets.every(d => d.subhead.length <= 60)"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks: text_overflow guards translated copy (§11.1)
      value: "return ['in_bounds', 'contrast>=4.5', 'text_overflow'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

