# ── export #1: 300-dpi print PNG + .pcraft archive ────────────────────────────
- id: export-print-300dpi
  description: >-
    Export the A5 flyer as a 300-dpi print PNG (2480x3508) plus a .pcraft archive
    copy. Pure read+export: zero undo entries, no document mutation, no destructive
    tools (§1.5-3 export exception); quick tier = 1 credit.
  vars:
    brief: "Export this flyer as a 300-dpi print PNG (2480×3508) and keep a .pcraft archive next to it for the printer."
    snapshot:
      canvas: { w: 1748, h: 2480 }
      layers:
        - { name: Background, kind: fill, opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 180 }
        - { name: Subhead, kind: text, size: 64 }
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: []
      components: []
    budget: "quick — 1 credit, 20k/2k tokens in/out, 6 tool calls, 1 revision, 2 min wall clock (§5.2)"
    plan:
      intent: export
      template: null            # export never regenerates (§23.5)
      assets: []
      slots: {}
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography: {}
      steps:
        - { tool: export.render, args: { format: png, width: 2480, height: 3508, dpi: 300 } }
        - { tool: export.save, args: { format: pcraft } }
      checks: [aspect, safe_area]
      model_tier: quick
      notes_for_user: "Print PNG at 300dpi exported; the layered .pcraft archive sits beside it. Source untouched."
    run:
      status: succeeded
      credits_charged: 1        # §5.2 quick tier; exports prefer off-peak batch (§5.3)
      tool_calls: 2
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }  # validated before export
      layers: [Background, Photo, Headline, Subhead]
      undo_entries: 0           # nothing mutated — no history entry
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match: export (§5.5)
      value: "return JSON.parse(output).plan.intent === 'export'"
    - type: javascript          # export never regenerates (§23.5)
      value: "return JSON.parse(output).plan.template === null"
    - type: javascript          # print settings exact: 2480x3508 @ 300dpi
      value: "return JSON.parse(output).plan.steps[0].args.width === 2480 && JSON.parse(output).plan.steps[0].args.height === 3508 && JSON.parse(output).plan.steps[0].args.dpi === 300"
    - type: javascript          # .pcraft archive keeps the layered source (§10)
      value: "return JSON.parse(output).plan.steps.some(s => s.args.format === 'pcraft')"
    - type: javascript          # §1.5-3: no destructive tools on the export path
      value: "return JSON.parse(output).plan.steps.every(s => !/flatten|merge|rasterize/i.test(s.tool))"
    - type: javascript          # tier cost exact (§5.2: quick = 1 credit)
      value: "return JSON.parse(output).run.credits_charged === 1"
    - type: javascript          # max tool calls respected (§5.2: quick cap = 6)
      value: "return JSON.parse(output).run.tool_calls <= 6 && JSON.parse(output).plan.steps.length <= 6"
    - type: javascript          # no mutation: zero undo entries (§5.6)
      value: "return JSON.parse(output).run.undo_entries === 0"

