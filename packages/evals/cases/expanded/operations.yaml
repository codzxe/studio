        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest]
      model_tier: standard
      notes_for_user: "Added the dark comp and the Japanese data set; EN light comp stays the master."
    run:
      status: succeeded
