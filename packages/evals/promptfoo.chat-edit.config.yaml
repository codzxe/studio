# =============================================================================
# @studio/evals — chat-edit CLASSIFIER gate config (spec §19 Phase 2 / §23.5)
#
# Spec refs:
#   §19     Phase 2 exit gates: "eval suite >= 50 briefs with >= 85% pass" (→
#           promptfoo.config.yaml) AND "chat edits correct >= 90% on the
#           curated set". Chat-edit correctness is graded at TWO levels, each
#           with its own promptfoo run (one eval = one results file = one pass
#           rate, hence three configs):
#             - chat-edits.config.yaml — the 14 planner-level edit_layers briefs
#               (does the run planner handle a chat edit at the right tier, on
#               the right layers? gate >= 0.90);
#             - THIS config — the 20-case §23.5 classifier curated set in
#               cases/chat-edits/ (does the chat-edit classifier route the
#               request to the right atoms, real layers, resolved tier, reapply
#               flag? gate >= 0.90 over 20 cases = at least 18 correct).
#   §23.5   the classification contract under test: exactly
#           { action, target_layers, args, cost_tier, needs_template_reapply }
#           (strict key set); the graded cost_tier is the RESOLVED tier of the
#           §23.5 cheapest-action guard — see cases/chat-edits/README.md.
#   §21 / §1.5-6 — deterministic mocked provider, synthetic data, zero model
#           calls in CI; real-model runs are opt-in with paid API keys only
#           (§5.3 allowlist), never free/training tiers, never OpenRouter.
#
# Registration history: cases/chat-edits/ (W7-H, 20 cases across 5 files) landed
# with its registration flagged for the evals owner; the W10-P final-review pass
# added this config so no case file on disk is left unregistered
# (scripts/eval-gate.mjs --dry checks the wiring offline; it now scans all three
# case directories).
#
# Gate: >= 0.90 over the 20 curated briefs (>= 18 correct), enforced by
#   node scripts/eval-gate.mjs --classifier results/chat-edit-eval.json \
#         [--suite results/suite.json --chat results/chat-edits.json]
# (or the legacy positional form: node scripts/eval-gate.mjs <file> 0.90).
# Every case carries its asserts INLINE (the strict §23.5 key schema, action
# atom-set match, never-invented target layers, §14.1 tier credits, reapply
# flag + case-specific pins), so this config deliberately has NO defaultTest
# envelope block — the {plan, run} envelope contract belongs to the two
# planner-gate configs only.
# =============================================================================

description: "studio chat-edit classifier evals — §23.5 curated set (§19 Phase 2: pass-rate >= 0.90)"

prompts:
  # §23.5 classifier starter mirror (canonical, versioned prompt lives in
  # packages/agent/prompts/v1/chat-edit-classifier.md — sync TODO noted in the file).
  - prompts/chat-edit-classifier.system.txt

providers:
  # CI default — deterministic mocked classifier: echoes each case's golden
  # `classification` var (mock-planner precedent; §1.5-6: no free-tier surface).
  # TODO(W6/W7): replace with the real ChatEditClassifier wrapper emitting the
  # RESOLVED cost_tier (see cases/chat-edits/README.md "Provider contract").
  - file://providers/mock-chat-edit.mjs

  # ── Optional real-model wiring (local only; NEVER free tiers, §1.5-6) ──────────
  # Same policy as promptfoo.config.yaml: paid API keys only (§5.3), CLI provider
  # override, never committed. The real provider MUST emit the §23.5 classification
  # JSON itself (no {plan, run} envelope) with cost_tier = the resolved tier.

# The 20 curated classifier briefs (6 + 4 + 4 + 3 + 3 — see cases/chat-edits/README.md).
# This set is deliberately NOT part of promptfoo.config.yaml: the suite's
# defaultTest asserts the {plan, run} planner envelope, which the §23.5
# classification output intentionally violates — blending the sets would fail
# every classifier case (that is why registration needed this third config).
tests:
  - cases/chat-edits/quick-edits.yaml   # 6 §24.2-style quick single-atom edits
  - cases/chat-edits/composites.yaml    # 4 two-op composites ("+"-joined, §24.2)
  - cases/chat-edits/clarify.yaml       # 4 ambiguous requests → ask_user first (§23.2)
  - cases/chat-edits/reapply.yaml       # 3 template-slot edits (needs_template_reapply)
  - cases/chat-edits/downgrades.yaml    # 3 tier-inflation traps (resolved tier, §23.5)

evaluate:
  # 2-CPU box (AGENTS.md): same cap as the other two configs; the mocked provider
  # is instant.
  maxConcurrency: 4
