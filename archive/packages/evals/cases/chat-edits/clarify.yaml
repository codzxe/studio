    layer: the flyer carries FOUR text layers (Headline, Subhead — Date,
    Body — Venue, Caption — Footer), all enumerable by kind — a defensible
    clarification lists ALL of them (required subset = all four); quick tier
    = 1 credit; nothing mutated.
  vars:
    userRequest: "Change the text."
    doc:
      template: event-flyer@1
      canvas: { w: 1748, h: 2480 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_815, bounds: [150, 150, 1448, 980] }
        - { name: Footer Strip, kind: fill, fill: '#D96C3B', opacity: 100 }
