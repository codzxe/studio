    "Swap the image for the newer upload." on a doc with TWO image layers
    (Photo + Logo) and TWO newer uploads in the catalog (asset_813 photo,
    asset_202 logo): "the image" is genuinely ambiguous — §23.5 forbids
    guessing, so the classifier lists both image layers as candidates; both
    are REQUIRED; quick tier = 1 credit.
  vars:
    userRequest: "Swap the image for the newer upload."
    doc:
      template: instagram-post@3
      canvas: { w: 1080, h: 1080 }
