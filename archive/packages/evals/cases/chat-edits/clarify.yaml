          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: clarify, never composed (§23.5)
      value: "return ((a) => a.length === 1 && a.includes('clarify'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # the edit pauses before any mutation (§23.2)
      value: "return JSON.parse(output).target_layers.length === 0"
    - type: javascript          # candidates: the three text layers required, nothing invented (§23.5)
      value: "return ((c) => Array.isArray(c) && ['Headline','Subhead','Body'].every((x) => c.includes(x)) && c.every((x) => ['Background','Accent Band','Logo','Headline','Subhead','Body'].includes(x)))(JSON.parse(output).args.candidates)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (quick = 1)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # ONE question within the 300-char ask_user budget
      value: "return ((q) => typeof q === 'string' && q.trim().length > 0 && q.length <= 300)(JSON.parse(output).args.question)"

# ── clarify #3: "change the text" — four text layers, none named ─────────────
