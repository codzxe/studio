# =============================================================================
# packages/evals/cases/chat-edits/composites.yaml — the curated chat-edit
# classifier eval set (W7-H): 4 COMPOSITE (two-op) requests.
#
# Spec anchors:
#   §24.2   the composite precedent: "Make the subhead smaller and add a 20%
#           OFF badge." — the §23.5 `action` field parses "+"-joined atoms
#           (parseActionExpr, max 3, unique); each atom's payload scopes under
#           args keyed by the atom name (worker-side convention, see
#           packages/agent/src/classifier/prompt.ts CHAT_EDIT_COMPOSITE_-
#           CONVENTIONS). Spaces around "+" are tolerated.
#   §23.5   one action expression, one target_layers array for ALL atoms.
#   §5.2    the deterministic tier guard (resolveCostTier) prices composites by
#           workload: each layer-targeted atom costs max(1, |target_layers|)
#           calls; add_component/export cost 1; the run tail is 3 calls
#           (render + validate + commit). Cheapest tier whose §5.2 cap fits
#           (quick 6 / standard 12 / complex 24) wins -> credits 1/2/5 (§14.1).
#           So: #07/#08 (1 target + 1 canvas atom) stay quick; #09 (two
#           targeted atoms x two targets) and #10 (4 targets + badge) resolve
#           STANDARD (2 credits) — the guard RAISES a quick proposal that would
#           stop mid-edit (§5.2), and the golden cost_tier is the resolved tier.
# =============================================================================

# ── composite #1: §24.2 verbatim — restyle + add_component ───────────────────
- id: ce-comp-subhead-badge
  description: >-
    §24.2 VERBATIM ("Make the subhead smaller and add a 20% OFF badge."): the
    canonical composite — action "restyle+add_component", target Subhead,
    quick tier = 1 credit (5 estimated calls: restyle + component.place +
    render/validate/commit tail, §5.2 cap 6). Badge = offer-badge@2 with
    vars{label:"20% OFF"} top-right; no template reapply (§23.5).
  vars:
    userRequest: "Make the subhead smaller and add a 20% OFF badge."
    doc:
      template: instagram-post@3          # starting doc: the §24.1 coffee promo
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 36, text: 'Open 7–5 · Main St' }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components:
        - { id: offer-badge@2, version: 2, variables: [label, bg, textColor, showRibbon] }
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    classification:                        # golden §23.5 output (mock provider echoes)
      action: restyle+add_component        # §24.2 composite, "+"-joined atoms
      target_layers: [Subhead]
      args:                                # per-atom scoped payloads (§24.2 convention)
        restyle: { size: 30 }              # §24.2: type.edit Subhead 36 -> 30pt
        add_component: { component: 'offer-badge@2', vars: { label: '20% OFF' }, anchor: 'topRight' }
      cost_tier: quick
      needs_template_reapply: false
    expected:
      action: restyle+add_component
      target_layers: [Subhead]
      cost_tier: quick
      credits: 1                           # §14.1 price of the resolved tier
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: the §24.2 atom set, order/space-tolerant
      value: "return ((a) => a.length === 2 && a.includes('restyle') && a.includes('add_component'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # target_layers subset: Subhead named, nothing invented (§23.5)
      value: "return ((t) => t.includes('Subhead') && t.every((x) => ['Background','Photo','Headline','Subhead'].includes(x)))(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (§24.2 quick = 1)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match — targeted composite, no regen (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # §24.2 payloads, scoped per atom: 30pt + offer-badge@2 "20% OFF"
      value: "return ((a) => a.restyle.size === 30 && a.add_component.component === 'offer-badge@2' && a.add_component.vars.label === '20% OFF')(JSON.parse(output).args)"
    - type: contains            # §24.2 badge copy rides the classification (§21)
      value: "20% OFF"

# ── composite #2: new copy + brand color on one layer (set_text + recolor) ────
- id: ce-comp-headline-text-color
  description: >-
    Two ops on ONE layer stay quick: new headline copy + the terracotta brand
    token — set_text+recolor, target Headline only; 5 estimated calls < the
    quick cap 6 (§5.2), so the guard keeps quick = 1 credit; no reapply.
  vars:
    userRequest: "Change the headline to 'Small batch, big mornings' and give it the terracotta brand color."
    doc:
      template: instagram-post@3
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, fill: '#3B2A20', text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 36, text: 'Open 7–5 · Main St' }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components: []
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    classification:
      action: set_text+recolor
      target_layers: [Headline]
      args:
        set_text: { text: 'Small batch, big mornings' }   # 22 chars, inside the 42-char slot cap (§23.2)
        recolor: { fill: '#D96C3B' }     # palette brand token, never invented
      cost_tier: quick
      needs_template_reapply: false
    expected:
      action: set_text+recolor
      target_layers: [Headline]
      cost_tier: quick
      credits: 1
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: set_text + recolor atoms (§23.5/§24.2)
      value: "return ((a) => a.length === 2 && a.includes('set_text') && a.includes('recolor'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # target_layers subset: Headline named, nothing invented (§23.5)
      value: "return ((t) => t.includes('Headline') && t.every((x) => ['Background','Photo','Headline','Subhead'].includes(x)))(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (quick = 1)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 1"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # per-atom payloads: exact copy (slot-capped) + palette token
      value: "return ((a) => a.set_text.text === 'Small batch, big mornings' && a.recolor.fill === '#D96C3B')(JSON.parse(output).args)"

# ── composite #3: delete + reposition (remove_layer + move -> standard) ──────
- id: ce-comp-remove-move
  description: >-
    Two ops on TWO layers: delete the 10% OFF badge and nudge the subhead up.
    Deterministic guard math (§5.2): remove_layer and move each cost
    max(1, |targets|) = 2 calls -> 4 + 3-call tail = 7 > quick cap 6, so the
    tier resolves STANDARD = 2 credits (a quick proposal is raised, warning
    attached — the lighter tier would stop mid-edit); no reapply. Undo still
    lands in ONE step (§1.5-10).
  vars:
    userRequest: "Delete the badge and nudge the subhead up a touch."
    doc:
      template: instagram-post@3
      canvas: { w: 1080, h: 1080 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_812 }
        - { name: Headline, kind: text, size: 88, text: 'Fresh roasted, every morning' }
        - { name: Subhead, kind: text, size: 30, text: 'Open 7–5 · Main St' }
        - { name: Badge, kind: component, component: 'offer-badge@2', vars: { label: '10% OFF' } }
      palette: ['#F4E7D3', '#3B2A20', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: instagram-post@3 }]
      components:
        - { id: offer-badge@2, version: 2, variables: [label, bg, textColor, showRibbon] }
      assets: [{ id: asset_812, name: 'latte-hero.jpg', kind: photo }]
    classification:
      action: remove_layer+move
      target_layers: [Badge, Subhead]      # one array for both atoms (§23.5)
      args:
        remove_layer: {}
        move: { dy: -60 }                  # nudge the subhead up
      cost_tier: standard                  # resolved: 7 estimated calls > quick cap (§5.2)
      needs_template_reapply: false
    expected:
      action: remove_layer+move
      target_layers: [Badge, Subhead]
      cost_tier: standard
      credits: 2                           # §14.1 price of the resolved tier
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: remove_layer + move atoms (§23.5/§24.2)
      value: "return ((a) => a.length === 2 && a.includes('remove_layer') && a.includes('move'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # target_layers subset: BOTH named, nothing invented (§23.5)
      value: "return ((t) => t.includes('Badge') && t.includes('Subhead') && t.every((x) => ['Background','Photo','Headline','Subhead','Badge'].includes(x)))(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (standard = 2)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 2"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # composite scoping: both atoms carry per-atom payloads
      value: "return ((a) => typeof a.remove_layer === 'object' && typeof a.move.dy === 'number' && a.move.dy < 0)(JSON.parse(output).args)"

# ── composite #4: flyer-wide recolor + badge (recolor x4 + add_component) ─────
- id: ce-comp-recolor-badge
  description: >-
    Two ops, four targets: recolor the flyer's four text layers terracotta and
    add a 20% OFF badge. Guard math (§5.2): recolor costs max(1,4) = 4 calls +
    add_component 1 + 3-call tail = 8 > quick cap 6, <= standard cap 12 ->
    STANDARD = 2 credits. Template = event-flyer@1 (real manifest layers);
    terracotta #D96C3B is a flyer palette token (§23.2); no reapply.
  vars:
    userRequest: "Recolor the headline, date, venue and footer line in terracotta and add a 20% OFF badge."
    doc:
      template: event-flyer@1
      canvas: { w: 1748, h: 2480 }
      layerSummary:
        - { name: Background, kind: fill, fill: '#F4E7D3', opacity: 100 }
        - { name: Photo, kind: smart_object, asset: asset_815, bounds: [150, 150, 1448, 980] }
        - { name: Footer Strip, kind: fill, fill: '#D96C3B', opacity: 100 }
        - { name: Content, kind: group }
        - { name: Headline, kind: text, size: 140, text: 'Summer Street Fair' }
        - { name: 'Subhead — Date', kind: text, size: 64, text: 'Sat 10–6' }
        - { name: 'Body — Venue', kind: text, size: 64, text: 'Main Street Plaza' }
        - { name: 'Caption — Footer', kind: text, size: 60, text: 'Coffee · Beats · Local Makers' }
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates: [{ id: event-flyer@1 }]
      components:
        - { id: offer-badge@2, version: 2, variables: [label, bg, textColor, showRibbon] }
      assets: [{ id: asset_815, name: 'street-fair.jpg', kind: photo }]
    classification:
      action: recolor+add_component
      target_layers: ['Subhead — Date', 'Body — Venue', 'Caption — Footer', Headline]
      args:
        recolor: { fill: '#D96C3B' }       # flyer palette token, never invented (§23.2)
        add_component: { component: 'offer-badge@2', vars: { label: '20% OFF' }, anchor: 'bottomRight' }
      cost_tier: standard                  # resolved: 8 estimated calls > quick cap (§5.2)
      needs_template_reapply: false
    expected:
      action: recolor+add_component
      target_layers: [Headline, 'Subhead — Date', 'Body — Venue', 'Caption — Footer']
      cost_tier: standard
      credits: 2
      needs_template_reapply: false
  assert:
    - type: is-json            # §23.5 classification contract — strict key set
      validate:
        type: object
        required: [action, target_layers, args, cost_tier, needs_template_reapply]
        additionalProperties: false
        properties:
          action: { type: string, minLength: 1, maxLength: 120 }
          target_layers: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
          args: { type: object }
          cost_tier: { enum: [quick, standard, complex] }
          needs_template_reapply: { type: boolean }
    - type: javascript          # action match: recolor + add_component atoms (§23.5/§24.2)
      value: "return ((a) => a.length === 2 && a.includes('recolor') && a.includes('add_component'))(JSON.parse(output).action.split('+').map((s) => s.trim()).filter(Boolean))"
    - type: javascript          # target_layers subset: all FOUR flyer text layers named (§23.5)
      value: "return ((t) => ['Headline','Subhead — Date','Body — Venue','Caption — Footer'].every((x) => t.includes(x)) && t.every((x) => ['Background','Photo','Footer Strip','Content','Headline','Subhead — Date','Body — Venue','Caption — Footer'].includes(x)))(JSON.parse(output).target_layers)"
    - type: javascript          # tier match: §14.1 credits of cost_tier (standard = 2)
      value: "return ({quick:1, standard:2, complex:5})[JSON.parse(output).cost_tier] === 2"
    - type: javascript          # needs_template_reapply match (§23.5)
      value: "return JSON.parse(output).needs_template_reapply === false"
    - type: javascript          # per-atom payloads: palette token + catalog component + label
      value: "return ((a) => a.recolor.fill === '#D96C3B' && a.add_component.component === 'offer-badge@2' && a.add_component.vars.label === '20% OFF')(JSON.parse(output).args)"
