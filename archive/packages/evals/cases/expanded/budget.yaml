# =============================================================================
# packages/evals/cases/expanded/budget.yaml — golden briefs: budget-cap clean stops
# (W7-D growth wave; §5.2 "Exceeding a budget is a FEATURE, not an error: stop
# cleanly, commit what strengthened the document, charge partially at most, and
# tell the user what was cut"; §1.5 constraint 7 money discipline).
#
# Companion to the Wave-1 seed budget-cap-complex-carousel (which proves a plan
# that FITS the budget with headroom). These two pin the opposite corner: the run
# genuinely HITS the hard tool-call cap and must stop cleanly with:
#   - run.status = succeeded_with_warnings (§5.1 ship-the-best-render rule),
#   - partial credits (0 < charged < full tier price, §5.2),
#   - run.tool_calls exactly at the cap (the cap is a hard stop, never exceeded),
#   - notes_for_user stating what was cut,
#   - undo_entries = 1 (the partial work is still ONE committed transaction).
# =============================================================================

# ── budget clean-stop #1: complex tier exhausts the 24-call cap ────────────────
- id: budget-stop-complex-carousel
  description: >-
    Six-slide brand-story carousel on the complex tier: generated hero, icon bullets
    everywhere, price + CTA. The golden run exhausts the 24-call hard cap before the
    last slide's icon row, stops CLEANLY per §5.2 (no error, no rollback), commits
    the five finished slides as one transaction, charges PARTIAL credits (3 of the
    5-credit tier price) and tells the user exactly what was cut.
  vars:
    brief: "Six-slide brand-story carousel: cover, three story slides, two product slides with icon bullets, price tag and CTA — generate a hero image, keep it inside the complex tier."
    snapshot:
      canvas: { w: 1080, h: 1350 }
      layers: []
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B', '#3B2A20']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates:
        - id: carousel-launch@1
          tags: [carousel, launch, social]
          canvas: { w: 1080, h: 1350 }
          slides: 6
          slots:
            cover_headline: { kind: text, maxChars: 40 }
            story_1_headline: { kind: text, maxChars: 40 }
            story_2_headline: { kind: text, maxChars: 40 }
            story_3_headline: { kind: text, maxChars: 40 }
            product_1_headline: { kind: text, maxChars: 40 }
            product_2_headline: { kind: text, maxChars: 40 }
            cover_photo: { kind: image, minPixels: 1024 }
      components:
        - { id: icon-bullet@1, vars: [icon, text] }
        - { id: price-tag@1, vars: [price, currency, bg, textColor] }
        - { id: button-cta@1, vars: [label, bg, textColor, rounded] }
    budget: "complex — 5 credits, 200k/12k tokens in/out, 24 tool calls, 2 revisions, 10 min wall clock (§5.2)"
    plan:
      intent: create_post
      template: carousel-launch@1
      assets:
        - { ref: 'imagegen:brand-hero', slot: cover_photo, fit: cover }
      slots:
        cover_headline: "Our first five years"
        story_1_headline: "It started with one grinder"
        story_2_headline: "Then the roastery"
        story_3_headline: "Then you showed up"
        product_1_headline: "The subscription"
        product_2_headline: "The new blend"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography:
        cover_headline: { font: display-serif, weight: bold, size: 96 }
      steps:
        - tool: image.generate
          args: { prompt: "warm brand hero, terracotta and cream, soft light", size: 1024 }
        - { tool: template.apply, args: { id: carousel-launch@1 } }
        - { tool: doc.place, args: { asset: 'imagegen:brand-hero', layer: Photo, fit: cover } }
        - { tool: type.edit, args: { layer: Cover, size: 96 } }
        - { tool: type.edit, args: { layer: Story1, size: 64 } }
        - { tool: type.edit, args: { layer: Story2, size: 64 } }
        - { tool: type.edit, args: { layer: Story3, size: 64 } }
        - { tool: type.edit, args: { layer: Product1, size: 64 } }
        - { tool: type.edit, args: { layer: Product2, size: 64 } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: check, text: 'The grinder' } } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: check, text: 'The roastery' } } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: check, text: 'The regulars' } } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: check, text: 'Sub saves 15%' } } }
        - { tool: component.place, args: { id: price-tag@1, vars: { price: '18', currency: '$' } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution, min_font_size]
      model_tier: complex
      notes_for_user: "Budget stopped the run at the 24-call cap: five slides are finished and committed; the last slide's icon row was cut. Resume with a follow-up quick edit if you want it."
    run:
      status: succeeded_with_warnings   # §5.2 clean stop — ship the best committed state
      credits_charged: 3        # §5.2 partial charge (3 of the 5-credit complex price)
      tool_calls: 24             # exactly at the §5.2 hard cap — the stop was clean, not over
      revisions: 1
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 1 }
      layers: [Background, Photo, Cover, Story1, Story2, Story3, Product1, Product2, PriceTag]
      undo_entries: 1            # the partial work is still ONE transaction (§1.5-10)
      rolled_back: false         # clean stop — never a rollback
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template chosen when expected (§21)
      value: "return JSON.parse(output).plan.template === 'carousel-launch@1'"
    - type: javascript          # §5.2 clean stop: warnings status, NOT failed
      value: "return JSON.parse(output).run.status === 'succeeded_with_warnings' && JSON.parse(output).run.rolled_back === false"
    - type: javascript          # §5.2 partial credits: more than zero, less than the 5-credit tier price
      value: "return ((c) => c > 0 && c < 5)(JSON.parse(output).run.credits_charged)"
    - type: javascript          # §5.2 hard cap: exactly at 24, never over
      value: "return JSON.parse(output).run.tool_calls === 24 && JSON.parse(output).plan.steps.length <= 24"
    - type: javascript          # §5.2: the user is told what was cut
      value: "return JSON.parse(output).plan.notes_for_user.toLowerCase().includes('cut')"
    - type: javascript          # partial work still committed as one undoable transaction (§1.5-10)
      value: "return JSON.parse(output).run.undo_entries === 1 && JSON.parse(output).run.reservation_released === true"
    - type: javascript          # validator: committed partial state is still valid (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── budget clean-stop #2: standard tier exhausts the 12-call cap ──────────────
- id: budget-stop-standard-icons
  description: >-
    Feature-grid post on the standard tier: headline, subhead, FOUR icon-bullet
    rows, price tag and CTA. The golden run hits the 12-call hard cap after two icon
    rows, stops cleanly, charges 1 partial credit (of the 2-credit standard price),
    commits the strengthened document and names the cut ("rows 3-4") for the user.
  vars:
    brief: "Feature-grid post for the landing push: headline, sub, four feature rows with icon bullets, the $29 price tag, and the CTA button — standard tier."
    snapshot:
      canvas: { w: 1080, h: 1080 }
      layers: []
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates:
        - id: instagram-post@3
          tags: [promo, social, square]
          canvas: { w: 1080, h: 1080 }
          slots:
            headline: { kind: text, maxChars: 42 }
            subhead: { kind: text, maxChars: 60 }
            photo: { kind: image, minPixels: 600 }
      components:
        - { id: icon-bullet@1, vars: [icon, text] }
        - { id: price-tag@1, vars: [price, currency, bg, textColor] }
        - { id: button-cta@1, vars: [label, bg, textColor, rounded] }
    plan:
      intent: create_post
      template: instagram-post@3
      assets: []
      slots:
        headline: "Why teams switch to us"
        subhead: "Four things, one screenshot"
      palette: ['#6B4A32', '#F4E7D3', '#D96C3B']
      typography:
        headline: { font: display-serif, weight: bold, size: 88 }
        subhead: { font: brand-sans, size: 36 }
      steps:
        - { tool: template.apply, args: { id: instagram-post@3 } }
        - { tool: type.edit, args: { layer: Headline, size: 88 } }
        - { tool: type.edit, args: { layer: Subhead, size: 36 } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: bolt, text: 'Drafts in seconds' } } }
        - { tool: component.place, args: { id: icon-bullet@1, vars: { icon: layers, text: 'Everything stays editable' } } }
        - { tool: component.place, args: { id: price-tag@1, vars: { price: '29', currency: '$' } } }
        - { tool: component.place, args: { id: button-cta@1, vars: { label: 'Try it free' } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, min_font_size]
      model_tier: standard
      notes_for_user: "Budget stopped the run at the 12-call cap: headline, two feature rows, price tag and CTA are committed; feature rows 3-4 were cut. One quick edit finishes them."
    run:
      status: succeeded_with_warnings   # §5.2 clean stop
      credits_charged: 1        # §5.2 partial charge (1 of the 2-credit standard price)
      tool_calls: 12            # exactly at the §5.2 hard cap — clean, not over
      revisions: 1
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 2 }  # two empty row placeholders flagged minor
      layers: [Background, Headline, Subhead, IconBullet, IconBullet, PriceTag, Button]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template chosen when expected (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-post@3'"
    - type: javascript          # §5.2 clean stop: warnings status, NOT failed, nothing rolled back
      value: "return JSON.parse(output).run.status === 'succeeded_with_warnings' && JSON.parse(output).run.rolled_back === false"
    - type: javascript          # §5.2 partial credits: more than zero, less than the 2-credit tier price
      value: "return ((c) => c > 0 && c < 2)(JSON.parse(output).run.credits_charged)"
    - type: javascript          # §5.2 hard cap: exactly at 12, never over
      value: "return JSON.parse(output).run.tool_calls === 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # §5.2: the cut is named for the user
      value: "return JSON.parse(output).plan.notes_for_user.toLowerCase().includes('cut')"
    - type: javascript          # what DID land: two icon rows + price + CTA committed (§21 layer names)
      value: "return ['Headline', 'Subhead', 'PriceTag', 'Button'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # one transaction, reservation released (§1.5-10, §14.2)
      value: "return JSON.parse(output).run.undo_entries === 1 && JSON.parse(output).run.reservation_released === true"
