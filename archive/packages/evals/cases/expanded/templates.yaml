      assets:
        - { id: asset_781, name: 'print-fair.jpg', kind: photo }
    catalog:
      templates:
        - id: event-flyer@1
          tags: [print, flyer, a5, event]
          canvas: { w: 1748, h: 2480 }
          slots:
            photo: { kind: image, minPixels: 1200 }
            headline: { kind: text, maxChars: 30 }
            date: { kind: text, maxChars: 36 }
            venue: { kind: text, maxChars: 36 }
            footer: { kind: text, maxChars: 48 }
            badge: { kind: component, optional: true }
      components: []
    plan:
      intent: create_post
      template: event-flyer@1
      assets:
