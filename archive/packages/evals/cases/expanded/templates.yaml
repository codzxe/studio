# =============================================================================
# packages/evals/cases/expanded/templates.yaml — golden briefs: one happy-path
# create per ACTUAL template manifest that landed from W7-A/B/C (§21 W7-D).
#
# Every case pins the real id@version from evals/templates/*/manifest.json, fills
# only slots the manifest declares (within their real maxChars/minPixels), places
# the components the manifest names (ribbon-banner@1, avatar-circle@1,
# button-cta@1, offer-badge@2, social-handle@1, wave-divider@1, price-tag@1),
# asserts the manifest's layerMap layer names and §7.2 rules, and prices the run
# at the standard tier (§5.2: 2 credits, 12-call cap).
#
# NOTE: evals/templates/cafe-menu@1/ was still manifest-less at authoring time
# (empty dir); when its manifest lands, add its happy path here with the same
# recipe (README § "Template coverage note").
# =============================================================================

# ── blog-cover@1 (1200x630 OG image; required ribbon-banner badge slot) ───────
- id: create-blog-cover-og
  description: >-
    Happy path for blog-cover@1: required ribbon-banner@1 badge ("DESIGN", 6 of 16
    chars) top-left, 35-char title inside the 70-char cap, author byline and the
    optional avatar-circle@1 ("MC") filled; standard tier = 2 credits; validator
    clean.
  vars:
    brief: "Open Graph cover for the engineering post 'How we cut our render time in half', byline 'By Maya Chen · 6 min read', DESIGN category ribbon, and my MC avatar."
    snapshot:
      canvas: { w: 1200, h: 630 }
      layers: []
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#FFF7EE']
      fonts: ['display-serif', 'brand-sans']
    catalog:
      templates:
        - id: blog-cover@1
          tags: [blog, cover, og-image, social]
          canvas: { w: 1200, h: 630 }
          slots:
            badge: { kind: component, component: ribbon-banner@1, optional: false }
            title: { kind: text, maxChars: 70 }
            author: { kind: text, maxChars: 60 }
            avatar: { kind: component, component: avatar-circle@1, optional: true }
      components:
        - { id: ribbon-banner@1, vars: [label, bg, textColor, corner] }
        - { id: avatar-circle@1, vars: [initials, bg, textColor] }
    plan:
      intent: create_post
      template: blog-cover@1
      assets: []
      slots:
        title: "How we cut our render time in half"
        author: "By Maya Chen · 6 min read"
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#FFF7EE']
      typography:
        title: { font: display-serif, weight: bold, size: 64 }
        author: { font: brand-sans, size: 32 }
      steps:
        - { tool: template.apply, args: { id: blog-cover@1 } }
        - { tool: component.place, args: { id: ribbon-banner@1, vars: { label: DESIGN, bg: '#3B2A20', textColor: '#FFF7EE' } } }
        - { tool: type.edit, args: { layer: Headline, size: 64 } }
        - { tool: type.edit, args: { layer: Author, size: 32 } }
        - { tool: component.place, args: { id: avatar-circle@1, vars: { initials: MC, bg: '#3B2A20' } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area]
      model_tier: standard
      notes_for_user: "blog-cover@1 with the DESIGN ribbon, the title at 64pt and your MC avatar beside the byline."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 8
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Ribbon Banner, Headline, Author, Avatar Circle]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'blog-cover@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # layer names: manifest layerMap roles (§7.2)
      value: "return ['Background', 'Ribbon Banner', 'Headline', 'Author', 'Avatar Circle'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # required badge slot filled within the 16-char cap (§7.2/§8.2)
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'component.place' && s.args.id === 'ribbon-banner@1' && s.args.vars.label === 'DESIGN' && s.args.vars.label.length <= 16)"
    - type: javascript          # slot contents: title + author within maxChars (§7.2)
      value: "return JSON.parse(output).plan.slots.title === 'How we cut our render time in half' && JSON.parse(output).plan.slots.title.length <= 70 && JSON.parse(output).plan.slots.author === 'By Maya Chen · 6 min read' && JSON.parse(output).plan.slots.author.length <= 60"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── business-card@1 (3.5x2in print; name/title/contact + accent band) ────────
