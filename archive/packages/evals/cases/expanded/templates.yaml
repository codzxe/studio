# ── instagram-story@1 (9:16; 128px platform safe area; swipe-up badge) ───────
- id: create-story-swipe-up
  description: >-
    Happy path for instagram-story@1: vertical story with cover photo across the top
    two-thirds, 15-char headline (40-char cap), subhead and the optional offer-badge@2
    "SWIPE UP" (8 of 12 chars); the 128px safe area clears platform chrome; standard
    tier = 2 credits.
  vars:
    brief: "Story for the opening morning: the queue photo, headline 'Doors open at 7', sub 'First 50 get a free pastry', swipe-up badge."
    snapshot:
      canvas: { w: 1080, h: 1920 }
      layers: []
      palette: ['#FFF7EE', '#3B2A20', '#6B5748', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
      assets:
        - { id: asset_812, name: 'opening-queue.jpg', kind: photo }
    catalog:
      templates:
        - id: instagram-story@1
          tags: [social, promo, story, vertical]
          canvas: { w: 1080, h: 1920 }
          slots:
            photo: { kind: image, minPixels: 1000 }
            headline: { kind: text, maxChars: 40 }
            subhead: { kind: text, maxChars: 40 }
            swipeUp: { kind: component, component: offer-badge@2, optional: true }
      components:
        - { id: offer-badge@2, vars: [label, bg, textColor, showRibbon] }
    plan:
      intent: create_post
      template: instagram-story@1
      assets:
        - { ref: asset_812, slot: photo, fit: cover, focal: { x: 0.5, y: 0.4 } }
      slots:
        headline: "Doors open at 7"
        subhead: "First 50 get a free pastry"
      palette: ['#FFF7EE', '#3B2A20', '#6B5748', '#D96C3B']
      typography:
        headline: { font: display-serif, weight: bold, size: 96 }
        subhead: { font: brand-sans, size: 40 }
      steps:
        - { tool: template.apply, args: { id: instagram-story@1 } }
        - { tool: doc.place, args: { asset: asset_812, layer: Photo, fit: cover, focalY: 0.4 } }
        - { tool: type.edit, args: { layer: Headline, size: 96 } }
        - { tool: type.edit, args: { layer: Subhead, size: 40 } }
        - { tool: component.place, args: { id: offer-badge@2, vars: { label: 'SWIPE UP' }, anchor: bottomRight } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution]
      model_tier: standard
      notes_for_user: "instagram-story@1 with the swipe-up badge; copy stays inside the 128px platform safe area."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 8
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, Badge]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'instagram-story@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # layer names: manifest layerMap roles (§7.2)
      value: "return ['Background', 'Photo', 'Headline', 'Subhead', 'Badge'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # swipe-up badge via the manifest's component pin (§7.2/§8.2)
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'component.place' && s.args.id === 'offer-badge@2' && s.args.vars.label === 'SWIPE UP' && s.args.vars.label.length <= 12)"
    - type: javascript          # slot contents within the 40-char caps (§7.2)
      value: "return JSON.parse(output).plan.slots.headline === 'Doors open at 7' && JSON.parse(output).plan.slots.headline.length <= 40 && JSON.parse(output).plan.slots.subhead === 'First 50 get a free pastry' && JSON.parse(output).plan.slots.subhead.length <= 40"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

