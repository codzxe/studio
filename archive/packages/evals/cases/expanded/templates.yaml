      palette: ['#101418', '#FFF7EE', '#F4E7D3', '#6B5748']
      typography:
        headline: { font: display-serif, weight: bold, size: 104 }
        subhead: { font: brand-sans, size: 40 }
      steps:
        - { tool: template.apply, args: { id: web-hero-banner@1 } }
        - { tool: doc.place, args: { asset: asset_935, layer: Photo, fit: cover } }
        - { tool: type.edit, args: { layer: Headline, size: 104 } }
        - { tool: type.edit, args: { layer: Subhead, size: 40 } }
        - { tool: component.place, args: { id: button-cta@1, vars: { label: 'Start free trial', bg: '#FFF7EE', textColor: '#101418', rounded: true } } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution]
      model_tier: standard
      notes_for_user: "web-hero-banner@1: copy sits in the crop-safe central band, screenshot fills the right half, CTA in place."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 8
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Subhead, CTA Button]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'web-hero-banner@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # layer names: manifest layerMap roles (§7.2)
      value: "return ['Background', 'Photo', 'Headline', 'Subhead', 'CTA Button'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # required CTA component slot filled within the 24-char cap (§7.2/§8.2)
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'component.place' && s.args.id === 'button-cta@1' && s.args.vars.label === 'Start free trial' && s.args.vars.label.length <= 24)"
    - type: javascript          # slot contents within the 40/90 caps (§7.2)
      value: "return JSON.parse(output).plan.slots.headline === 'Design at machine speed' && JSON.parse(output).plan.slots.headline.length <= 40 && JSON.parse(output).plan.slots.subhead === 'Prompt to layered artwork in one run — start free.' && JSON.parse(output).plan.slots.subhead.length <= 90"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

# ── x-post@1 (1600x900 big statement; scrim keeps contrast) ──────────────────
- id: create-x-post-statement
  description: >-
    Happy path for x-post@1: full-bleed background photo, 40-char centred headline
    (60-char cap) and — key template behavior — the editable SCRIM fill layer stays
    a live layer between photo and headline so contrast holds ≥4.5:1 over any photo
    (nothing baked, §25); standard tier = 2 credits.
  vars:
    brief: "Big statement post for X: the launch-night crowd photo full-bleed, headline 'We just shipped the thing you asked for.' centred."
    snapshot:
      canvas: { w: 1600, h: 900 }
