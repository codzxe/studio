  description: >-
    Happy path for event-flyer@1: A5 print flyer with cover photo, 17-char headline
    (30-char cap), date + venue lines, centred footer; the optional QR badge slot
    is NOT filled and must remain present-but-hidden (§7.3) — the layer tree keeps
