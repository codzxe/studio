    brief: "Standard business card for Maya Chen, Head of Design — contact 'maya@studio.design · +1 555 0134 · studio.design/maya', the logo, terracotta accent band."
    snapshot:
      canvas: { w: 1063, h: 652 }
      layers: []
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#D96C3B']
      fonts: ['display-serif', 'brand-sans']
