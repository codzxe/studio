      slots:
        headline: "Autumn print fair"
        date: "Sat 12 Oct · 10–6"
        venue: "Old Print Hall, Room 4"
        footer: "Free entry · workshops all day"
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#D96C3B']
      typography:
        headline: { font: display-serif, weight: bold, size: 150 }
        date: { font: brand-sans, weight: bold, size: 64 }
        venue: { font: brand-sans, size: 64 }
      steps:
        - { tool: template.apply, args: { id: event-flyer@1 } }
        - { tool: doc.place, args: { asset: asset_781, layer: Photo, fit: cover } }
        - { tool: type.edit, args: { layer: Headline, size: 150 } }
        - { tool: type.edit, args: { layer: 'Subhead — Date', size: 64 } }
        - { tool: type.edit, args: { layer: 'Body — Venue', size: 64 } }
        - { tool: type.edit, args: { layer: 'Caption — Footer', size: 60 } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution]
      model_tier: standard
      notes_for_user: "event-flyer@1 filled for the print fair; the optional QR badge stays hidden until you upload a QR asset."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 9
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Footer Strip, Headline, 'Subhead — Date', 'Body — Venue', 'Caption — Footer', Badge]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'event-flyer@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # §7.3: unfilled optional slot stays present (never deleted)
      value: "return JSON.parse(output).run.layers.includes('Badge') && !JSON.parse(output).plan.steps.some(s => s.args.id === 'qr-code@1')"
    - type: javascript          # layer names: manifest layerMap roles incl. dash-named slots (§7.2)
      value: "return ['Background', 'Photo', 'Headline', 'Subhead — Date', 'Body — Venue', 'Caption — Footer'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # slot contents within the real caps (30/36/36/48, §7.2)
      value: "return JSON.parse(output).plan.slots.headline === 'Autumn print fair' && JSON.parse(output).plan.slots.headline.length <= 30 && JSON.parse(output).plan.slots.date === 'Sat 12 Oct · 10–6' && JSON.parse(output).plan.slots.date.length <= 36 && JSON.parse(output).plan.slots.venue.length <= 36 && JSON.parse(output).plan.slots.footer.length <= 48"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

