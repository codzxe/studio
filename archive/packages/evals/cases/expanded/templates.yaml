      components: []
    plan:
      intent: create_post
      template: x-post@1
      assets:
        - { ref: asset_957, slot: photo, fit: cover, focal: { x: 0.5, y: 0.5 } }
      slots:
        headline: "We just shipped the thing you asked for."
      palette: ['#0A0A0A', '#FFFFFF', '#1D9BF0']
      typography:
        headline: { font: display-sans, weight: bold, size: 120 }
      steps:
        - { tool: template.apply, args: { id: x-post@1 } }
        - { tool: doc.place, args: { asset: asset_957, layer: Photo, fit: cover } }
        - { tool: type.edit, args: { layer: Headline, size: 120 } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution]
      model_tier: standard
      notes_for_user: "x-post@1 with the crowd shot full-bleed; the scrim layer keeps the white headline readable, nothing flattened."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 6
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Scrim, Headline]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'x-post@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # layer names incl. the live Scrim — never baked (§7.2/§25)
      value: "return ['Background', 'Photo', 'Scrim', 'Headline'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # slot contents: 40-char headline inside the 60-char cap (§7.2)
      value: "return JSON.parse(output).plan.slots.headline === 'We just shipped the thing you asked for.' && JSON.parse(output).plan.slots.headline.length <= 60"
    - type: javascript          # §25/§1.5-3: no flatten/bake step in the plan
      value: "return JSON.parse(output).plan.steps.every(s => !/flatten|merge|rasterize/i.test(s.tool))"
    - type: javascript          # validator results: contrast holds over the photo (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"
