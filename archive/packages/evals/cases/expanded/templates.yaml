            name: { kind: text, maxChars: 24 }
            title: { kind: text, maxChars: 32 }
            contact: { kind: text, maxChars: 108 }
            logo: { kind: image, optional: true }
            accent: { kind: color, optional: true }
      components: []
    plan:
      intent: create_post
      template: business-card@1
      assets:
        - { ref: asset_902, slot: logo, fit: contain }
      slots:
        name: "Maya Chen"
        title: "Head of Design"
        contact: "maya@studio.design · +1 555 0134 · studio.design/maya"
      palette: ['#F4E7D3', '#3B2A20', '#6B5748', '#D96C3B']
      typography:
        name: { font: display-serif, weight: bold, size: 84 }
        title: { font: brand-sans, size: 44 }
        contact: { font: brand-sans, size: 36 }
      steps:
        - { tool: template.apply, args: { id: business-card@1 } }
        - { tool: doc.place, args: { asset: asset_902, layer: Logo, fit: contain } }
        - { tool: type.edit, args: { layer: Headline, size: 84 } }
        - { tool: type.edit, args: { layer: Subhead, size: 44 } }
        - { tool: type.edit, args: { layer: Body, size: 36 } }
        - { tool: style.apply, args: { layer: Accent Band, fill: '#D96C3B' } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, min_font_size]
      model_tier: standard
      notes_for_user: "business-card@1 filled: name 84pt, three-line contact block, terracotta accent band, logo placed contain."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 9
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Accent Band, Headline, Subhead, Body, Logo]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin (§21)
      value: "return JSON.parse(output).plan.template === 'business-card@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # layer names: manifest layerMap roles (§7.2)
      value: "return ['Background', 'Accent Band', 'Headline', 'Subhead', 'Body', 'Logo'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # slot contents within the real caps (24/32/108, §7.2)
      value: "return JSON.parse(output).plan.slots.name === 'Maya Chen' && JSON.parse(output).plan.slots.name.length <= 24 && JSON.parse(output).plan.slots.title === 'Head of Design' && JSON.parse(output).plan.slots.title.length <= 32 && JSON.parse(output).plan.slots.contact.length <= 108"
    - type: javascript          # accent band recoloured to the brand terracotta token (§11.1)
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'style.apply' && s.args.layer === 'Accent Band' && s.args.fill === '#D96C3B')"
    - type: javascript          # validator results (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0)(JSON.parse(output).run.validator)"

