# =============================================================================
# packages/evals/cases/expanded/creates.yaml — golden briefs: create_post intents
# (W7-D growth wave, §21 "50+ golden briefs").
#
# Coverage targets of this file:
#   (a) every ACTUAL template in evals/templates/ gets >=1 happy-path brief:
#       instagram-post@3, youtube-thumbnail@1, presentation-slide@1
#   (b) every ACTUAL component in evals/components/ appears in >=1 brief:
#       avatar-circle@1, button-cta@1, logo-lockup@1, offer-badge@2, price-tag@1,
#       quote-block@1, ribbon-banner@1, social-handle@1, star-rating@1, wave-divider@1
#   (c) intent matrix row create_post x15 (14 here + 2 more in freeform.yaml,
#       plus clarify/injection/budget cases that also classify create_post).
#
# Slot budgets asserted against the ACTUAL manifests in evals/templates/*/manifest.json
# (headline maxChars 42 / subhead 60 on instagram-post@3; 30 on youtube-thumbnail@1;
# title 48 / subtitle 80 on presentation-slide@1) and the component variable caps
# in evals/components/*/component.json.
# =============================================================================

# ── template happy-path: youtube-thumbnail@1 (§7 manifest verbatim) ──────────
- id: create-thumb-yt-episode
  description: >-
    Happy path for youtube-thumbnail@1 (actual manifest in evals/templates/): full-bleed
    cover photo (asset_733, minPixels 1280x720), 18-char headline inside the 30-char
    slot cap, optional badge slot filled via offer-badge@2 label "NEW" at topRight;
    standard tier = 2 credits (§5.2); validator clean.
  vars:
    brief: "New video thumbnail for the camping gear review episode — huge text 'WE TESTED 12 TENTS', the ridge tent shot as the photo, red NEW badge in the corner."
    snapshot:
      canvas: { w: 1280, h: 720 }
      layers: []
      palette: ['#101418', '#FFFFFF', '#E5484D']
      fonts: ['display-sans', 'brand-sans']
      assets:
        - { id: asset_733, name: 'tent-ridge.jpg', kind: photo }
    catalog:
      templates:
        - id: youtube-thumbnail@1
          tags: [social, video, thumbnail, wide]
          canvas: { w: 1280, h: 720 }
          slots:
            headline: { kind: text, maxChars: 30 }
            photo: { kind: image, minPixels: 800 }
            badge: { kind: component, optional: true }
      components:
        - { id: offer-badge@2, vars: [label, bg, textColor, showRibbon] }
    plan:
      intent: create_post
      template: youtube-thumbnail@1
      assets:
        - { ref: asset_733, slot: photo, fit: cover, focal: { x: 0.5, y: 0.35 } }
      slots:
        headline: "WE TESTED 12 TENTS"
      palette: ['#101418', '#FFFFFF', '#E5484D']
      typography:
        headline: { font: display-sans, weight: bold, size: 88 }
      steps:
        - { tool: template.apply, args: { id: youtube-thumbnail@1 } }
        - { tool: doc.place, args: { asset: asset_733, layer: Photo, fit: cover, focalY: 0.35 } }
        - { tool: type.edit, args: { layer: Headline, size: 88 } }
        - { tool: component.place, args: { id: offer-badge@2, vars: { label: NEW }, anchor: topRight } }
        - { tool: render_preview, args: { size: 1024 } }
        - { tool: validate_document, args: {} }
        - { tool: agent.commit, args: {} }
      checks: [in_bounds, 'contrast>=4.5', headline_largest, safe_area, asset_resolution]
      model_tier: standard
      notes_for_user: "Built on youtube-thumbnail@1; headline fits the 30-char slot at 88pt over one line."
    run:
      status: succeeded
      credits_charged: 2        # §5.2 standard tier
      tool_calls: 7
      revisions: 0
      code: null
      retryable: null
      retry_grace: 0
      validator: { ok: true, blockers: 0, majors: 0, minors: 0 }
      layers: [Background, Photo, Headline, Badge]
      undo_entries: 1
      rolled_back: false
      reservation_released: true
  assert:
    - type: is-json            # plan_valid (schema)
      validate:
        type: object
        required: [plan, run]
        properties:
          plan: { type: object, required: [intent, template, steps, checks, model_tier] }
          run: { type: object, required: [status, credits_charged, tool_calls, validator, layers] }
    - type: javascript          # intent match (§21)
      value: "return JSON.parse(output).plan.intent === 'create_post'"
    - type: javascript          # template pin: actual manifest id@version (§21)
      value: "return JSON.parse(output).plan.template === 'youtube-thumbnail@1'"
    - type: javascript          # tier cost exact (§5.2: standard = 2 credits)
      value: "return JSON.parse(output).run.credits_charged === 2"
    - type: javascript          # max tool calls respected (§5.2: standard cap = 12)
      value: "return JSON.parse(output).run.tool_calls <= 12 && JSON.parse(output).plan.steps.length <= 12"
    - type: javascript          # expected checks present (§11.1 + §7.2 rules)
      value: "return ['in_bounds', 'contrast>=4.5', 'headline_largest', 'safe_area', 'asset_resolution'].every(c => JSON.parse(output).plan.checks.includes(c))"
    - type: javascript          # validator results: ok, zero blockers (§11.1)
      value: "return ((v) => v.ok === true && v.blockers === 0 && v.majors === 0 && v.minors === 0)(JSON.parse(output).run.validator)"
    - type: javascript          # layer names: manifest layerMap roles (§7.2)
      value: "return ['Background', 'Photo', 'Headline', 'Badge'].every(n => JSON.parse(output).run.layers.includes(n))"
    - type: javascript          # slot contents (§21) + §7.2 maxChars 30 budget
      value: "return JSON.parse(output).plan.slots.headline === 'WE TESTED 12 TENTS' && JSON.parse(output).plan.slots.headline.length <= 30"
    - type: javascript          # badge slot filled via the actual component pin (§8)
      value: "return JSON.parse(output).plan.steps.some(s => s.tool === 'component.place' && s.args.id === 'offer-badge@2' && s.args.vars.label === 'NEW')"

