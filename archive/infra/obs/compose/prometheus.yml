# =============================================================================
# infra/obs/compose/prometheus.yml — Prometheus scrape/eval config for the
# compose "obs" profile (spec §22; W9-M). Mounted read-only into the
# prometheus container at /etc/prometheus/prometheus.yml — see the prometheus
# service in infra/compose/docker-compose.yml and the W9-F contract in
# infra/obs/README.md ("Compose mount contract").
# =============================================================================
# BEARER/TOKEN (env interpolation): Prometheus does not expand env vars in its
# config and Compose does not interpolate mounted files, so this file carries
# the literal placeholder __METRICS_TOKEN__. The prometheus service entrypoint
# seds the real value from $METRICS_TOKEN (../../.env — the SAME shared secret
# gateway/worker require on /metrics) into a container-local copy,
# promtool-checks it, then execs prometheus. The token therefore never lands
# in a committed file (AGENTS.md: no secrets in the repo; .env stays 0600,
# §17.2). Keep the token `|`-free — sed's delimiter.
#
# AUTH SHAPE (per W9-G, verified by W9-P): the apps verify METRICS_TOKEN with
# a timing-safe HTTP Basic seam and IGNORE the username
# (apps/gateway/src/routes/metrics.ts, apps/worker/src/metrics.ts) — so jobs
# below use basic_auth and the token rides as the password.
#
# JOB LABELS: alerts in infra/obs/alerts/prometheus-rules.yml key off series
# names (studio_*, node_*, probe_*), NOT job labels — jobs are named
# gateway/worker/prometheus so dashboards and /api/v1 queries can group by
# `job`, and every target also carries an explicit `service` label.
#
# NOT WIRED YET (outside W9-M kept-scope; enable together with the matching
# compose service — infra/obs/README.md "Exporter layouts"):
#   - node_exporter     → RB-05 disk/memory alerts (placeholder mountpoint "/")
#   - blackbox_exporter → RB-06 provisional TLS-expiry probe
#   - pushgateway       → RB-06 backup timestamp + billing-manual MRR input
# They are deliberately not scraped here: dead targets would keep `up == 0`
# and create alert noise before those services exist.
# =============================================================================

global:
  # Fast series for the §22 p50/p95 panels; trivial load for two app targets
  # + rule groups on this box. Keep scrape_timeout < scrape_interval.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: studio

# W9-F contract: compose mounts infra/obs/alerts/prometheus-rules.yml as
# /etc/prometheus/rules/studio-alerts.yml ("Compose mount contract", README).
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager stub (same "obs" profile). Prometheus tolerates it being down —
# alerts remain visible in the Prometheus UI in the meantime.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- gateway — REST + SSE API (§3.1) ---------------------------------------
  # /metrics lives on its OWN internal listener (gateway:3001), container
  # network only — never published to the host (§17.2: only Caddy publishes
  # ports) and never routed by Caddy (Caddyfile answers /metrics with 404).
  - job_name: gateway
    metrics_path: /metrics
    basic_auth:
      # Username ignored by the app seam; token = Basic password.
      username: scraper
      password: __METRICS_TOKEN__ # ← sed-replaced at container start (header)
    static_configs:
      - targets: ["gateway:3001"]
        labels:
          service: gateway

  # --- worker — BullMQ agent loop (§3.1), deploy.replicas: 2 ------------------
  # Same ops port the compose healthcheck uses (worker:9876), internal network
  # only (§17.2). dns_sd instead of a static target so BOTH worker replicas
  # are discovered and replica churn (scale/redeploy) is picked up via
  # refresh_interval re-resolution.
  # NOTE (worker owner): compose documents the ops server as loopback-bound
  # INSIDE its container — cross-container scrapes need it bound to 0.0.0.0 on
  # the internal bridge (still unreachable from the internet: nothing
  # publishes host ports but Caddy, §17.2) or these targets stay `down` with
  # connection refused. Scraped with the same METRICS_TOKEN (Basic-auth).
  - job_name: worker
    metrics_path: /metrics
    basic_auth:
      # Same seam as the gateway job: username ignored, token = password.
      username: scraper
      password: __METRICS_TOKEN__
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9876
        refresh_interval: 30s
    relabel_configs:
      # Keep the `service` label identical to the gateway job's.
      - target_label: service
        replacement: worker

  # --- prometheus itself ------------------------------------------------------
  # Cheap self-scrape: keeps `up{job="prometheus"}` honest and surfaces the
  # TSDB's own health series in queries.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # --- Follow-ups (W9-F contract, NOT in W9-M scope — see header) --------------
  # Add the compose service first, then uncomment:
  # - job_name: node-exporter              # host disk/memory (RB-05)
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  # - job_name: blackbox                    # public https probe (RB-06 provisional)
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets: ["https://<APP_DOMAIN>"] # substitute the public URL on the box
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115
  # - job_name: pushgateway                  # backup timestamp + billing-manual MRR
  #   honor_labels: true
  #   static_configs:
  #     - targets: ["pushgateway:9091"]
