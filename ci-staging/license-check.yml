# License gate — spec §16 (license policy) and §21 (CI license checks).
#
# The authoritative gate is `scripts/check-licenses.mjs` (W1-R; contract: exit
# non-zero when a disallowed license is found — AGPL/SSPL/BUSL/RSALv2/Elastic/
# FSL/"source-available" per §16.5 — and verify ATTRIBUTION.md rows per §16).
#
# FALLBACK (documented): if scripts/check-licenses.mjs is missing (W1-R still in
# flight), the step below degrades to `pnpm dlx license-checker --summary
# --failOn "<denylist>"`. That fallback is coarse — license-checker does not
# fully traverse pnpm's symlinked node_modules layout and it does not check
# ATTRIBUTION.md — so treat it as a tripwire, not a gate, and delete it once
# the real script lands.
#
# Runs weekly (schedule) and on any dependency-manifest change.
name: license-check

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Mondays 04:17 UTC (off the hour to avoid GH load)
  workflow_dispatch:
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "**/package.json"
      - "scripts/check-licenses.mjs"
      - "ATTRIBUTION.md"
      - "LICENSES/**"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "**/package.json"
      - "scripts/check-licenses.mjs"
      - "ATTRIBUTION.md"
      - "LICENSES/**"

permissions:
  contents: read

jobs:
  license-check:
    name: license gate (§16 / §21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack (pinned by packageManager field)
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (license metadata lives in node_modules)
        run: pnpm install --no-frozen-lockfile
        # TODO(W1-M): flip to --frozen-lockfile once pnpm-lock.yaml is committed.

      - name: License gate
        run: |
          set -euo pipefail
          if [ -f scripts/check-licenses.mjs ]; then
            node scripts/check-licenses.mjs
          else
            echo "::warning title=check-licenses.mjs missing::W1-R script not landed yet — running the documented coarse license-checker fallback (see workflow comments)."
            pnpm dlx license-checker@latest --summary \
              --failOn "AGPL-3.0;AGPL-1.0;SSPL-1.0;BUSL-1.1;RSALv2;Elastic-License-2.0;FSL-1.1;Sustainable-Use-License"
          fi
