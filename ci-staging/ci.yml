# CI — spec §17.3 (on PR: cached install, lint/biome, typecheck, unit tests, build)
# and §21 (CI runs: lint, typecheck, unit/integration, license checks — the license
# gate lives in license-check.yml: weekly + on manifest change).
#
# Dev-box note (docs/AGENTS.md): agents must NOT run pnpm install on the 2-CPU box;
# this workflow is the fleet's verifier. Turborepo runs with --concurrency=1
# (2-CPU note; also keeps memory sane once Next.js builds land).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (PR pushes); never kill an in-flight main build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Service endpoints for the (future) §21 integration layer: gateway ↔ engine
  # sessions, Drizzle migration checks, BullMQ queue tests. Unit tests today are
  # deterministic and network-free. Image families match §17.2 compose (postgres:16,
  # valkey:8 — NOT Redis, §16.5).
  DATABASE_URL: postgres://studio:studio@localhost:5432/studio_test
  VALKEY_URL: redis://localhost:6379

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack (pinned by packageManager field)
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
        # NOTE: while pnpm-lock.yaml has not been committed yet, the cache lookup
        # no-ops with a warning (harmless). Caching starts automatically once the
        # lockfile lands.

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        # TODO(W1-M): flip to `pnpm install --frozen-lockfile` as soon as
        # pnpm-lock.yaml is committed; CI must fail on lockfile drift from then on.

      - name: Turbo — lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build --concurrency=1
        continue-on-error: false
