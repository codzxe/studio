# =============================================================================
# infra/compose/docker-compose.yml — single-node production stack (spec §17.2)
# =============================================================================
# Target: ONE AWS Lightsail 4 GB instance, Ubuntu 24.04, Docker Compose (§17.1).
# All-in box for the first ~10–20 active users; no per-service tax.
#
# HOW TO RUN (canonical env file is the repo root .env, ADR-0002):
#     docker compose --env-file ../../.env -f docker-compose.yml up -d
# --env-file feeds ${...} interpolation from the SAME file the containers get
# via env_file (single source of truth; keep .env chmod 0600, §17.2).
#
# Environments (§17.5): local/staging/production all use this file; staging is
# the SAME box but a separate Compose project — set COMPOSE_PROJECT_NAME and a
# separate .env (own subdomain + own DB). Never test migrations on prod first.
#
# Stack rules honored here (§17.2): every service has a healthcheck,
# restart: unless-stopped, resource limits on the engine pool, ONLY Caddy
# publishes host ports, secrets via env file 0600, logs rotated via
# json-file caps (≤ 500 MB box-wide, §17.4).
#
# W10-E note: the four app services build from the REPO-ROOT context (the
# W9-I Dockerfiles need pnpm-workspace.yaml + packages/* sources): context is
# `../..` + a repo-relative `dockerfile:` path, and a root .dockerignore
# guards what enters the build. env_file/volume paths still resolve relative
# to THIS directory (infra/compose/), so ../../.env is the repo root .env in
# every case — do not "fix" them to the build context.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-studio}

# Rotated structured logs for every service (§17.4 disk pressure rule).
# 10 MB × 5 files × ~9 services ≈ 450 MB — inside the 500 MB budget.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Common healthcheck tuning (§17.2 "every service has a healthcheck").
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  # --------------------------------------------------------------------------
  # Caddy — TLS termination + reverse proxy (§3.1 proxy row, §16.3 Apache-2.0).
  # The ONLY service with host ports (80/443). Automatic ACME certificates on
  # first boot once DNS points at the box (§17.1 first-boot runbook).
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 443/udp is HTTP/3; harmless on firewalls that only filter TCP.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Site config is owned here (infra/caddy/Caddyfile) — mounted read-only.
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certs + ACME account must survive redeploys or we re-issue on every boot.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Least privilege: Caddy gets ONLY the proxy vars — not the full .env
      # (no Stripe/LLM keys inside the TLS proxy container).
      # {$APP_DOMAIN} site address in the Caddyfile (DNS must exist first,
      # or ACME fails — see infra/README.md first-boot runbook).
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required in ../../.env (public DNS name for TLS, §17.1)}
      GATEWAY_INTERNAL: ${GATEWAY_INTERNAL:-gateway:8787}
      WEB_INTERNAL: ${WEB_INTERNAL:-web:3000}
      # ACME_EMAIL (optional, for expiry notices): add here + the Caddyfile's
      # global `email` block — an empty value is a Caddy config error, so it
      # is deliberately NOT defaulted here.
    healthcheck:
      <<: *healthcheck-defaults
      # Port 80 always answers (ACME http-01 + redirect) — no self-signed TLS
      # needed for a liveness probe.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # gateway — Hono REST + SSE API (§3.1). Stateless. Never receives host
  # ports: Caddy proxies {$APP_DOMAIN}/v1/* → gateway:8787.
  # --------------------------------------------------------------------------
  gateway:
    # Repo-root build context (W9-I→W10-E): the Dockerfile needs
    # pnpm-workspace.yaml + packages/* sources, so context is the repo root
    # and dockerfile: is repo-relative.
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    # IMAGE_TAG (W9-J): deploy-v2.sh pins app:<git-sha> (refuses :latest unless
    # ALLOW_LATEST); CI (§17.3) pushes GHCR refs — set e.g.
    # GATEWAY_IMAGE=ghcr.io/<owner>/gateway in ../../.env on the box to pull
    # those. Defaults = local name + :latest so `docker compose build` works
    # out of the box and tags what it builds.
    image: ${GATEWAY_IMAGE:-gateway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Non-root: the W9-I Dockerfile ships `USER node` (§15.2 least privilege).
    # MIGRATE=1 entrypoint contract (W9-J migrate.sh, §17.3): one-shot
    # migrations run `docker compose --env-file ../../.env run --rm --no-deps
    # -e MIGRATE=1 gateway`; the image entrypoint must honor MIGRATE=1 (exec
    # drizzle-kit migrate via packages/db/drizzle.config.ts INSTEAD of the API
    # server). TODO(wiring wave): the W9-I CMD starts the server directly —
    # add the MIGRATE branch in the image/bootstrap, not here (compose only
    # injects the flag).
    env_file:
      - ../../.env
    healthcheck:
      <<: *healthcheck-defaults
      # Liveness route built by apps/gateway/src/routes/health.ts
      # (GET /v1/health). Uses Node's global fetch so the check survives any
      # base image (no curl/wget dependency inside app images).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.GATEWAY_PORT??'8787')+'/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    # Metrics listener (§22): Prometheus-format /metrics on its OWN internal
    # port 3001 (separate from the 8787 API). `expose` only DOCUMENTS the port
    # on the internal bridge — it does not publish anything; ONLY Caddy
    # publishes host ports (§17.2). Prometheus (profile obs) scrapes
    # gateway:3001/metrics (studio_* series, W10-E) with the METRICS_TOKEN
    # (Basic-auth; the app seam ignores the username —
    # infra/obs/compose/prometheus.yml). W10-E: the /metrics router IS mounted
    # (apps/gateway/src/app.ts); the dedicated 3001 listener in src/index.ts is
    # flagged to the wiring wave (until then it answers on the app listener
    # behind the same auth seam, and Caddy 404s /metrics at the edge either
    # way). NEVER move this to `ports:` — /metrics stays
    # unreachable from the internet.
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # worker — BullMQ agent loop, critic, exports (§3.1). Two replicas on the
  # 4 GB box (§17.2); each honors WORKER_CONCURRENCY (see .env.example).
  # No host port: its ops endpoint (9876: /health + /metrics, apps/worker
  # src/health.ts + src/metrics.ts) binds the INTERNAL compose bridge only
  # (WORKER_HEALTH_HOST below) — Prometheus (obs profile) and compose exec
  # reach it, the internet cannot (§17.2: only Caddy publishes host ports).
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    # IMAGE_TAG (W9-J): see the gateway service note.
    image: ${WORKER_IMAGE:-worker}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      # §17.2 pins replicas: 2. Compose v2 honors deploy.replicas; keep small
      # on a 4 GB box shared with Postgres + the engine pool.
      replicas: 2
    # Non-root: the W9-I Dockerfile ships `USER node` (see gateway).
    env_file:
      - ../../.env
    environment:
      # W9-M flag → W10-E fix: the ops listeners (health + /metrics) default
      # to LOOPBACK inside the container; on the compose bridge they must bind
      # 0.0.0.0 or Prometheus scrapes (obs profile) and cross-container probes
      # stay down. Still box-private — NEVER `ports:` (§17.2). The worker
      # bootstrap (wiring wave) must honor WORKER_HEALTH_HOST; flagged to the
      # config owner to add it to the env schema (ADR-0002).
      WORKER_HEALTH_HOST: ${WORKER_HEALTH_HOST:-0.0.0.0}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9876}
    volumes:
      # §3.2 engine binary (W9-I decision, W10-E wiring): the pinned Rust
      # `photocraft-cli` (ADR-0001) is host-compiled and bind-mounted
      # read-only — images do NOT bake it. The host dir /engine must contain
      # the binary at photocraft-cli so the in-container
      # ENV ENGINE_BINARY_PATH=/engine/photocraft-cli resolves; .env must
      # never override ENGINE_BINARY_PATH away from /engine.
      - /engine:/engine:ro
    healthcheck:
      <<: *healthcheck-defaults
      # Worker ops endpoint (apps/worker/src/health.ts): GET /health on
      # WORKER_HEALTH_PORT (default 9876); probed in-container via loopback
      # regardless of the 0.0.0.0 bridge bind in `environment:` above.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT??'9876')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    # Metrics (§22): the ops listener serves Prometheus-format /metrics at
    # worker:9876/metrics (studio_* series, W10-E). INTERNAL NETWORK ONLY —
    # `expose` publishes nothing (§17.2: only Caddy publishes host ports);
    # Prometheus (profile obs) scrapes it with the METRICS_TOKEN (Basic-auth;
    # the app seam ignores the username). The `environment:` block above binds
    # the listener to 0.0.0.0 on the internal bridge (W9-M fix — still private
    # to the box) so cross-container scrapes succeed. NEVER move this to
    # `ports:`.
    expose:
      - "9876"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # engine-pool — supervisor spawning one `photocraft-cli serve` per active
  # tenant session (§3.2, §15.1). Capped at 2 GB / 2 CPU so a runaway engine
  # can never starve Postgres (§17.4 memory-pressure rule: the pool dies
  # first). Engine processes bind loopback inside this container — the
  # browser NEVER reaches them (§3.2). No host ports, ever.
  # --------------------------------------------------------------------------
  engine-pool:
    # W9-I decision (supersedes the old "bake the binary" note, §3.2): the
    # pinned Rust `photocraft-cli` (ADR-0001) is NOT baked into the image — it
    # is host-compiled and bind-mounted read-only below.
    build:
      context: ../..
      dockerfile: apps/engine-pool/Dockerfile
    # IMAGE_TAG (W9-J): see the gateway service note.
    image: ${ENGINE_POOL_IMAGE:-engine-pool}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    volumes:
      # Per-session working dirs / capability roots live here (§3.2, §15.1).
      - engine_work:/work
      # §3.2 engine binary (W9-I/W10-E): read-only host bind-mount; the
      # in-container ENV ENGINE_BINARY_PATH=/engine/photocraft-cli must
      # resolve — never override it in .env.
      - /engine:/engine:ro
    # Non-root: the W9-I Dockerfile ships `USER node` and chowns /engine +
    # /work so the mounted binary stays runnable by the app user (§15.1).
    env_file:
      - ../../.env
    healthcheck:
      <<: *healthcheck-defaults
      # TODO(engine-pool Wave 2): replace this process-liveness stopgap with
      # the supervisor's real probe once it exposes one; gateway's
      # /v1/health/deep already carries an engine_pool probe (§22).
      test: ["CMD", "node", "-e", "process.kill(1,0)"]
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # web — Next.js marketing + product UI (§3.1). Caddy proxies everything not
  # under /v1/* here. In staging/prod static assets may move to Cloudflare
  # Pages (§17.1) — this service stays as the SSR/app origin either way.
  # --------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # IMAGE_TAG (W9-J): see the gateway service note.
    image: ${WEB_IMAGE:-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Non-root: the W9-I Dockerfile ships `USER node` (Next.js runs fine
    # unprivileged; .next cache dir is owned by that user).
    env_file:
      - ../../.env
    healthcheck:
      <<: *healthcheck-defaults
      # Marketing page answers 200 on /. Swap for /api/health if web adds one.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WEB_PORT??'3000')+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
    depends_on:
      # Ordering only — the web server starts fine while the API is down.
      gateway:
        condition: service_started
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # db — PostgreSQL 16, source of truth (§3.1 db row, §12 data model).
  # Official image; the entrypoint self-demotes to the unprivileged
  # `postgres` user after init. pgdata volume survives redeploys.
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Interpolation comes from ../../.env (pass --env-file, see header).
      # No secret defaults — fail fast on a missing password (§4).
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in ../../.env (must match the password inside DATABASE_URL)}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-studio}\" -d \"$${POSTGRES_DB:-studio}\""]
    networks: [studio]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # valkey — queue/cache store (§3.1). Valkey, NOT Redis ≥ 7.4: Redis is
  # RSALv2/SSPL and forbidden by license policy — Valkey is BSD-3-Clause
  # (§16.3, §16.5). noeviction: BullMQ jobs must NEVER be silently evicted.
  # No host ports — only the internal bridge network.
  # --------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # §17.2 exact flags: snapshot every 60s if ≥1 key changed, 512 MB cap.
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "valkey-cli", "ping"]
    volumes:
      # Snapshots survive container replacement (cheap warm-start bonus).
      - valkey_data:/data
    networks: [studio]
    logging: *default-logging

  # ==========================================================================
  # profile "obs" — optional observability tooling (§17.1 obs row, §22).
  # Enable with: docker compose --env-file ../../.env --profile obs up -d
  # Not started by default; keep the box lean at ≤ 2 users (§17.2 Langfuse
  # note applies to all heavy obs self-hosting).
  #
  # W9-M stack (§16.5 license-clean): Prometheus (Apache-2.0) scrapes
  # gateway/worker /metrics with the METRICS_TOKEN (Basic-auth) and evaluates the
  # §22 alert rules from infra/obs; Alertmanager stub routes alerts
  # (receivers log-only until the on-call rotation in infra/obs/README.md is
  # real); Perses (Apache-2.0) serves dashboards. Grafana was deliberately
  # NOT added: AGPL-3.0 (§16.5) — §16's license policy would allow an
  # internal, unmodified, separately-run copy as a utility, but Perses fills
  # the same role with zero copyleft exposure (W9-F flagged it; dashboards'
  # PromQL carries over). Uptime Kuma (MIT) + GlitchTip (MIT) keep roles.
  # ==========================================================================

  # Uptime Kuma — external uptime pings (MIT, §16.3). §17.2 pins the 1.x
  # major (louislam/uptime-kuma:1) for stability; `latest` per task — pin to
  # :1 on the box if upgrades churn. Reach it via SSH tunnel or a subdomain
  # site block in Caddyfile, NOT a published port.
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    profiles: ["obs"]
    restart: unless-stopped
    volumes:
      - kuma:/app/data
    healthcheck:
      <<: *healthcheck-defaults
      # Kuma listens on 3001 in-container; image ships Node.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
    networks: [studio]
    logging: *default-logging

  # GlitchTip — Sentry-compatible error tracking (MIT, §16.3; avoids the
  # FSL-licensed Sentry server, §16.5). Postgres dependency note: it MUST use
  # its OWN database (and role) on the shared Postgres instance — never the
  # app DB. Create once before first boot:
  #   docker compose --env-file ../../.env exec db psql -U studio \
  #     -c "CREATE ROLE glitchtip LOGIN PASSWORD '<pw>'" \
  #     -c "CREATE DATABASE glitchtip OWNER glitchtip"
  # Cache: Valkey DB 1 (BullMQ owns DB 0) — redis://valkey:6379/1.
  # Image runs as root in its stock Dockerfile — acceptable for profile-
  # gated tooling; harden with `user:` once the image's uid/gid is verified.
  glitchtip:
    image: glitchtip/glitchtip:latest
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY required when the obs profile runs}
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:?GLITCHTIP_DATABASE_URL required when the obs profile runs (own DB, e.g. postgres://glitchtip:<pw>@db:5432/glitchtip)}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:-redis://valkey:6379/1}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # Django app served by uWSGI on 8080; python3 is guaranteed in-image.
      # Verify this endpoint on first boot and adjust if the major changes.
      start_period: 60s
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
    networks: [studio]
    logging: *default-logging

  # Prometheus — metrics hub for the obs profile (§22). prom/prometheus is
  # Apache-2.0 (§16). Scrapes gateway:3001 and worker:9876 /metrics
  # (METRICS_TOKEN — the apps verify it via timing-safe Basic auth and ignore
  # the username, W9-G seam) and evaluates the §22 alert rules from infra/obs.
  # INTERNAL ONLY: no host port — reach the UI via SSH tunnel or a Caddyfile
  # subdomain block, never a published port (§17.2).
  prometheus:
    # Pin a major on the box (e.g. :v3.x) once verified; `latest` matches the
    # uptime-kuma/glitchtip choice until then.
    image: prom/prometheus:latest
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      # Same shared secret gateway/worker require on /metrics (../../.env).
      # Fail fast when the obs profile runs without it (GlitchTip pattern).
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN required when the obs profile runs (shared secret gateway/worker verify on /metrics — Basic-auth password, username ignored — same value as ../../.env)}
    # Compose does NOT interpolate mounted files and Prometheus does not read
    # env vars in its config, so the entrypoint seds the __METRICS_TOKEN__
    # placeholder from infra/obs/compose/prometheus.yml into a container-local
    # tmpfs copy, promtool-checks it, and execs prometheus — the token never
    # lands in a committed file (§17.2: secrets live in the 0600 env file).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sed "s|__METRICS_TOKEN__|$$METRICS_TOKEN|g" /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        promtool check config /tmp/prometheus.yml
        exec prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ../obs/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # §22 alert rules (W9-F contract: mount as /etc/prometheus/rules/*.yml).
      - ../obs/alerts/prometheus-rules.yml:/etc/prometheus/rules/studio-alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        # Obs tooling must never starve the app/engine pool (§17.4 memory
        # rule). TSDB for 2 targets @15s fits 512 MB comfortably.
        limits:
          memory: 512m
    healthcheck:
      <<: *healthcheck-defaults
      # busybox-based image → wget; /-/ready is the readiness endpoint.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
    networks: [studio]
    logging: *default-logging

  # Alertmanager — routing stub for §22 alerts (prom/alertmanager, Apache-2.0).
  # STUB by design: the on-call rotation in infra/obs/README.md is a
  # placeholder, so the receivers in infra/obs/compose/alertmanager.yml are
  # log-only (alerts appear in the UI + container logs, nothing pages).
  # Wire real receivers (ops-channel webhook, GlitchTip, SMTP) when the
  # rotation lands. INTERNAL ONLY — same no-published-port rule (§17.2).
  alertmanager:
    # Pin on the box alongside prometheus.
    image: prom/alertmanager:latest
    profiles: ["obs"]
    restart: unless-stopped
    volumes:
      - ../obs/compose/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Silences/notification-log survive container replacement.
      - alertmanager_data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      <<: *healthcheck-defaults
      # Same busybox base as prometheus; /-/ready is the readiness endpoint.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
    networks: [studio]
    logging: *default-logging

  # Perses — dashboards, REPLACING Grafana (§16.5: the grafana server is
  # AGPL-3.0; §16's license policy would allow an internal, unmodified,
  # separately-run copy as a utility, but persesdev/perses is Apache-2.0 —
  # same role, zero copyleft exposure). INTERNAL ONLY — reach the UI via SSH
  # tunnel or a Caddyfile subdomain block, never a published port (§17.2).
  #
  # Dashboard import path (W9-F contract): infra/obs/grafana/*.json are
  # plain Grafana-format JSONs (business/product/reliability/cost) mounted
  # below at /import/grafana. Perses ships Grafana-import tooling — run
  # inside the container:
  #     docker compose --env-file ../../.env --profile obs exec perses \
  #       perses import grafana /import/grafana/reliability.json
  # (verify the exact CLI shape on first boot). If the import tooling is
  # unavailable in this image build, the JSONs remain plain dashboards for
  # MANUAL import into any Grafana-compatible viewer. After importing,
  # provision a Prometheus datasource pointing at http://prometheus:9090
  # via the Perses UI/API — panel PromQL carries over untouched.
  perses:
    # Pin on the box once verified (persesdev/perses release tags).
    image: persesdev/perses:latest
    profiles: ["obs"]
    restart: unless-stopped
    volumes:
      # Default file-DB dir; verify on first boot if the image moves it.
      - perses_data:/perses
      # Documented import path for the W9-F Grafana-format dashboards.
      - ../obs/grafana:/import/grafana:ro
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      <<: *healthcheck-defaults
      # Default listen port 8080 (alpine base → busybox wget). Verify on
      # first boot and adjust if the major changes.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
    networks: [studio]
    logging: *default-logging

# =============================================================================
# Volumes (§17.2): pgdata + kuma are mandated; caddy_data keeps ACME certs
# across redeploys; caddy_config avoids ACME re-issues on config reloads;
# engine_work holds per-session capability roots; valkey_data holds snapshots.
# The obs profile adds the Prometheus TSDB, Alertmanager state and the Perses
# file DB so observability data survives container replacement.
# =============================================================================
volumes:
  pgdata:
  kuma:
  caddy_data:
  caddy_config:
  engine_work:
  valkey_data:
  prometheus_data:
  alertmanager_data:
  perses_data:

# =============================================================================
# Network: ONE internal bridge (§17.2: "no service exposes ports except
# Caddy"). Not `internal: true` — services need egress (S3, LLM APIs, ACME);
# isolation comes from publishing nothing but Caddy 80/443 and keeping
