# studio — Prometheus alert rules
# Spec §22 "Alerts (with runbooks)" — the authoritative alert list. Owner: infra/obs (W9-F).
#
# Metric contract: every studio_* series below is part of the canonical registry in
# infra/obs/README.md and is emitted by packages/agent/src/obs/metrics.ts (W9-D) or by the
# billing/backup sync jobs documented there. Placeholder syntax notes:
#   - Host alerts (disk/memory) use standard node_exporter series; adjust `mountpoint` to
#     the compose data-volume layout when W9-M wires node_exporter.
#   - TLS expiry uses blackbox_exporter's probe_ssl_earliest_cert_expiry against the public
#     https endpoint (module http_2xx, W9-M wires the probe).
#   - studio_backup_last_success_timestamp_seconds is pushed by infra/scripts/backup.sh
#     (pushgateway or textfile collector — README "Exporter layouts").
#   - studio_daily_cost_budget_usd is the budget gauge from DAILY_BUDGET_USD (config).
#
# Every alert maps 1:1 to a runbook: labels.runbook (RB-0X) + annotations.runbook_file.
# `for:` windows: §22 prescribes the window where stated (run failure rate: 15m); others
# persist thresholds long enough to avoid scrape-gap flapping, tuned per alert below.
groups:
  - name: studio-reliability
    interval: 30s
    rules:
      # §22: run failure rate > 5% (15 min) — RB-01
      - alert: StudioRunFailureRateHigh
        expr: |
          (
            sum(rate(studio_runs_total{status="failed"}[15m]))
              / clamp_min(sum(rate(studio_runs_total[15m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          runbook: RB-01
        annotations:
          summary: "Run failure rate above 5% over the last 15 minutes"
          description: "Failed runs exceed 5% of all runs over 15m (§22). Check recent run errors, engine and provider health. clamp_min guards the empty-queue divide-by-zero."
          runbook_file: "docs/runbooks/RB-01-run-failure-spike.md"

      # §22: queue age > 2 min — RB-02
      - alert: StudioQueueAgeHigh
        expr: studio_queue_age_seconds > 120
        for: 5m
        labels:
          severity: warning
          runbook: RB-02
        annotations:
          summary: "Queue age above 2 minutes"
          description: "The oldest queued run has waited more than 120s for 5+ minutes — worker pool saturation or a stalled job. Cross-check studio_queue_depth."
          runbook_file: "docs/runbooks/RB-02-queue-backlog.md"

      # §22: engine restarts > 3/h — RB-03
      - alert: StudioEngineRestartLoop
        expr: sum(increase(studio_engine_restarts_total[1h])) > 3
        for: 5m
        labels:
          severity: critical
          runbook: RB-03
        annotations:
          summary: "Engine pool restarting more than 3 times per hour"
          description: "More than 3 engine restarts in the last hour (§22) — suspected crash loop. Check worker logs for OOM/panic signatures before the pool exhausts capacity."
          runbook_file: "docs/runbooks/RB-03-engine-crash-loop.md"

      # §22: provider error rate > 10% — RB-04
      - alert: StudioProviderErrorRateHigh
        expr: |
          (
            sum(rate(studio_provider_requests_total{result="error"}[10m]))
              / clamp_min(sum(rate(studio_provider_requests_total[10m])), 1e-9)
          ) > 0.10
        for: 10m
        labels:
          severity: critical
          runbook: RB-04
        annotations:
          summary: "AI provider error rate above 10%"
          description: "More than 10% of provider requests failed over 10m for 10+ minutes (§22). Verify the active provider dashboard/status page; consider failover."
          runbook_file: "docs/runbooks/RB-04-provider-outage.md"

  - name: studio-billing
    interval: 30s
    rules:
      # §22: Stripe webhook failures — RB-07.
      # Placeholder threshold: >3 failures in 15m (ignores single transient retries);
      # tighten when the gateway exports per-event-type signature-verification counters.
      - alert: StudioStripeWebhookFailures
        expr: sum(increase(studio_stripe_webhook_events_total{result="failed"}[15m])) > 3
        for: 10m
        labels:
          severity: critical
          runbook: RB-07
        annotations:
          summary: "Stripe webhook processing failures"
          description: "More than 3 Stripe webhook events failed processing in 15m (§22). Billing integrity at risk (subscriptions/credits out of sync) — check the gateway webhook receiver and replay failed events from the Stripe dashboard."
          runbook_file: "docs/runbooks/RB-07-stripe-webhook-failures.md"

      # §22: cost per day > budget — RB-08.
      # Budget placeholder: studio_daily_cost_budget_usd gauge published from
      # DAILY_BUDGET_USD (config). scalar(max(...)) tolerates multiple exporters.
      - alert: StudioDailyCostOverBudget
        expr: |
          sum(increase(studio_ai_cost_usd_total[24h]))
            > scalar(max(studio_daily_cost_budget_usd))
        for: 15m
        labels:
          severity: critical
          runbook: RB-08
        annotations:
          summary: "AI cost per day exceeds budget"
          description: "Trailing-24h AI spend is above the daily budget (§22) — runaway loops, mispriced tiers or a traffic spike. Check the cost dashboard top-spenders panel."
          runbook_file: "docs/runbooks/RB-08-cost-guardrail-breach.md"

  - name: studio-infra
    interval: 30s
    rules:
      # §22: disk > 80% — RB-05. node_exporter layout; placeholder mountpoint "/"
      # (W9-M: point at the postgres/data volume mountpoint in compose).
      - alert: StudioHostDiskNearCapacity
        expr: |
          (
            1 - node_filesystem_avail_bytes{mountpoint="/"}
                  / node_filesystem_size_bytes{mountpoint="/"}
          ) > 0.80
        for: 15m
        labels:
          severity: warning
          runbook: RB-05
        annotations:
          summary: "Disk usage above 80%"
          description: "Root filesystem above 80% for 15+ minutes (§22). Postgres volumes and engine scratch dirs grow fastest — prune before writes fail."
          runbook_file: "docs/runbooks/RB-05-disk-usage.md"

      # §22: memory > 90% — RB-05 (host saturation; no dedicated runbook — see README gaps).
      - alert: StudioHostMemoryNearCapacity
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
          runbook: RB-05
        annotations:
          summary: "Memory usage above 90%"
          description: "Available memory below 10% for 10+ minutes (§22). Engine pools OOM first — check restart counts. Maps to RB-05 host-saturation runbook; a dedicated memory runbook is a flagged gap."
          runbook_file: "docs/runbooks/RB-05-disk-usage.md"

      # §22: backup older than 26 h — RB-06. 26h = 24h schedule + 2h grace.
      - alert: StudioBackupStale
        expr: (time() - studio_backup_last_success_timestamp_seconds) > 26 * 3600
        for: 30m
        labels:
          severity: warning
          runbook: RB-06
        annotations:
          summary: "Last successful backup is older than 26 hours"
          description: "No successful backup in >26h (§22) — RPO at risk. Run infra/scripts/backup.sh manually and schedule a restore drill."
          runbook_file: "docs/runbooks/RB-06-restore-drill.md"

      # §22: TLS certificate expiry — RB-06 (provisional mapping; dedicated TLS runbook
      # is a flagged gap — see README). blackbox_exporter layout; 14-day threshold.
      - alert: StudioTLSCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
          runbook: RB-06
        annotations:
          summary: "TLS certificate expires in less than 14 days"
          description: "The public endpoint's certificate renews in <14 days (§22). Caddy auto-renews via ACME — verify the renewal pipeline and DNS/HTTP-01 reachability. Provisional runbook mapping: RB-06 (continuity/DR) — dedicated TLS runbook flagged as a gap."
          runbook_file: "docs/runbooks/RB-06-restore-drill.md"
