# =============================================================================
# infra/obs/compose/alertmanager.yml — STUB routing config (spec §22; W9-M).
# Mounted read-only into the alertmanager container (compose profile "obs") at
# the image's default config path /etc/alertmanager/alertmanager.yml.
# =============================================================================
# Deliberately a STUB: the on-call rotation in infra/obs/README.md is a
# PLACEHOLDER, so there is nothing real to page yet — receivers below carry no
# integrations; alerts surface only in the Alertmanager UI (SSH tunnel) and in
# container logs. Routing contract (README "On-call rotation"): severity=
# critical → page the primary; severity=warning → ops channel, fix within
# business hours. Wire real receivers (ops-channel webhook, GlitchTip, or
# SMTP) into the `receivers:` block when the rotation lands. Every alert
# carries labels.runbook (RB-0X) → docs/runbooks/RB-0X-*.md — the runbook is
# the first-response protocol, this file only decides WHERE alerts go.
# =============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: stub-log
  group_by: ["alertname", "runbook"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # severity=critical → page the primary (wire a real receiver here).
    - matchers:
        - severity="critical"
      receiver: stub-log
    # severity=warning → ops channel, business hours (wire a real receiver).
    - matchers:
        - severity="warning"
      receiver: stub-log

receivers:
  - name: stub-log
    # Intentionally integration-free (see header). Alertmanager keeps state
    # (silences, notification log) in the alertmanager_data volume.
