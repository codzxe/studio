[package]
name = "studio-host"
description = "Builds a fully wired EffectCraft session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
studio-engine = { workspace = true }
studio-project = { workspace = true }
log = { workspace = true }
studio-media = { workspace = true }
studio-expr = { workspace = true }
studio-script = { workspace = true }
studio-export = { workspace = true }
studio-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
studio-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
studio-psd = { workspace = true }
studio-svg = { workspace = true }
studio-pdf = { workspace = true }
studio-raster = { workspace = true }
studio-time = { workspace = true }
studio-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
