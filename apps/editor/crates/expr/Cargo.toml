[package]
name = "studio-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
studio-time = { workspace = true }
studio-geom = { workspace = true }
studio-keyframe = { workspace = true }
serde_json = { workspace = true }
studio-project = { workspace = true }
studio-path = { workspace = true }
studio-render = { workspace = true }
boa_engine = { workspace = true }
# ENG-02 (2026-10-30 audit): the expression wall-clock budget needs a clock
# that works under wasm — std::time::Instant panics there, so the budget was
# hardcoded `false` on the web (a crafted expression froze the tab for
# minutes-to-forever). web_time re-exports std::time on native targets.
web-time = "1.1.0"

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
studio-color = { workspace = true }
studio-effects = { workspace = true }
studio-text = { workspace = true }
