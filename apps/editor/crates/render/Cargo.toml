[package]
name = "studio-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
studio-time = { workspace = true }
studio-geom = { workspace = true }
studio-color = { workspace = true }
studio-keyframe = { workspace = true }
studio-project = { workspace = true }
studio-raster = { workspace = true }
studio-path = { workspace = true }
studio-text = { workspace = true }
studio-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
studio-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
