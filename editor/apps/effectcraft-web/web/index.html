<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1c1f">
  <meta name="description" content="Studio: motion graphics and visual effects in the browser">
  <title>Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-256.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 56px; height: 56px; }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #device-lost {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; padding: 16px; text-align: center;
      background: rgb(18 18 18 / 0.85); color: #c8c8c8; font: 14px/1.4 system-ui, sans-serif;
    }
    #device-lost strong { color: #e3e3e3; font-size: 16px; }
    #device-lost p { margin: 0; max-width: 60ch; }
    #device-lost small { color: #8c8c8c; font-size: 12px; }
    #device-lost div { display: flex; gap: 8px; }
    #device-lost button {
      padding: 6px 14px; border: 1px solid #3a3a3a; border-radius: 4px;
      background: #232323; color: #e3e3e3; font: inherit; cursor: pointer;
    }
    #device-lost button:hover { background: #303030; }
    #device-lost button:last-child { background: #2d8ceb; border-color: #2d8ceb; }
    #device-lost button:last-child:hover { background: #4aa0f5; }
    #device-lost button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <canvas id="effectcraft_canvas"></canvas>
  <div id="loading"><img src="favicon.svg" alt=""><div id="status">Loading Studio…</div></div>
  <script type="module">
    import init, * as ec from "./effectcraft_web.js";
    const t0 = performance.now();
    window.effectcraftLoad = {};
    // The agent / test API: the desktop control channel as promises (docs/web.md).
    window.effectcraft = {
      request: (method, params) => ec.request(method, params ?? {}),
      execute: (command, params) => ec.request("engine.execute", { command, params: params ?? {} }),
      commands: () => ec.request("engine.commands", {}),
      inspect: () => ec.request("ui.inspect", {}),
      screenshot: (params) => ec.request("ui.screenshot", params ?? {}),
      renderFrame: (params) => ec.request("render.frame", { base64: true, ...(params ?? {}) }),
      files: () => ec.files(),
      readFile: (path) => ec.readFile(path),
      addFile: async (fileOrUrl, name) => {
        let bytes;
        if (typeof fileOrUrl === "string") {
          bytes = new Uint8Array(await (await fetch(fileOrUrl)).arrayBuffer());
          name = name ?? fileOrUrl.split("/").pop();
        } else {
          bytes = new Uint8Array(await fileOrUrl.arrayBuffer());
          name = name ?? fileOrUrl.name;
        }
        return ec.addFile(name, bytes);
      },
      info: () => ({
        ...ec.info(),
        crossOriginIsolated: self.crossOriginIsolated,
        webgpu: !!navigator.gpu,
        serviceWorker: (() => {
          try {
            return !!(navigator.serviceWorker && navigator.serviceWorker.controller);
          } catch {
            return false;
          }
        })(),
        load: window.effectcraftLoad,
      }),
      // Browser storage (OPFS / IndexedDB): save without downloading, list, remove, wait for writes.
      saveToBrowser: (path) => ec.saveToBrowser(path ?? undefined),
      listStored: () => ec.listStored(),
      removeStored: (path) => ec.removeStored(path),
      flush: () => ec.flush(),
      // A frame rendered in a frame worker (its GPU by default) vs the page's CPU: {maxDiff, meanDiff, over4, …}.
      workerFrameCheck: (params) => ec.workerFrameCheck(params ?? {}).then(JSON.parse),
    };
    // Offline start and install (PWA): the service worker caches the app's files.
    if (!new URLSearchParams(location.search).has("nosw")) {
      try {
        if ("serviceWorker" in navigator && navigator.serviceWorker) {
          navigator.serviceWorker.register("sw.js").catch((e) => console.warn("service worker:", e));
        }
      } catch (e) {
        console.warn("service worker:", e);
      }
    }
    // Ask for the high-performance GPU on every WebGPU adapter request that does not
    // name a preference: wgpu/eframe send none by default, so hybrid-graphics laptops
    // (an iGPU plus a discrete card) boot the editor on the power-saving iGPU. The
    // wrapper only fills in what the caller left unset.
    const gpu = navigator.gpu;
    if (gpu && typeof gpu.requestAdapter === "function" && !gpu.__studioHighPerformance) {
      const originalRequestAdapter = gpu.requestAdapter.bind(gpu);
      gpu.requestAdapter = (options) =>
        originalRequestAdapter(
          options && options.powerPreference ? options : { ...(options ?? {}), powerPreference: "high-performance" },
        );
      gpu.__studioHighPerformance = true;
    }
    try {
      const status = document.getElementById("status");
      const say = (text) => { if (status) status.textContent = text; };
      // GPU pre-flight, before the engine download. This build prefers WebGPU at
      // runtime and falls back to WebGL2:
      // - A WebGPU adapter answers -> leave the canvas alone; the engine boots
      //   WebGPU (the adapter shim above picks the discrete GPU).
      // - No adapter -> the engine will run WebGL2: take the context FIRST with
      //   wgpu's own attribute (antialias: false) plus the high-performance hint.
      //   The first getContext decides the GPU; wgpu's later call reuses our
      //   context instead of creating one without a preference.
      // - WebGL2 unavailable too -> fail NOW with the remedy, not after the whole
      //   engine download. On machines with a GPU this almost always means the
      //   browser's hardware acceleration is off.
      let webgpu = false;
      try {
        webgpu = !!(await gpu?.requestAdapter?.({ powerPreference: "high-performance" }));
      } catch {
        webgpu = false;
      }
      const gpuInfo = { webgpu, webgl2: false, renderer: "", software: false };
      if (!webgpu) {
        const canvas = document.getElementById("effectcraft_canvas");
        const gl = canvas && canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
        gpuInfo.webgl2 = !!gl;
        if (gl) {
          const dbg = gl.getExtension("WEBGL_debug_renderer_info");
          if (dbg) {
            gpuInfo.renderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
            gpuInfo.software = /swiftshader|llvmpipe|softpipe|software/i.test(gpuInfo.renderer);
          }
          if (gpuInfo.software) {
            say("GPU acceleration is off in this browser — running in software…");
          }
        } else {
          const message =
            "WebGL2 is not available in this browser, so the editor cannot start. " +
            "Turn on hardware acceleration (Chrome/Edge: Settings > System > " +
            '"Use graphics acceleration when available", then relaunch) and retry.';
          window.effectcraftLoad.error = message;
          if (status) {
            status.className = "err";
            status.textContent = message;
          }
          throw new Error(message);
        }
      }
      window.effectcraftLoad.gpu = gpuInfo;
      // The engine module: the host page (same-origin) may have started the
      // download + compile in parallel with this iframe — adopt its module
      // instead of downloading again. Any problem falls back to our own fetch.
      let module;
      try {
        const warm = window.parent !== window ? window.parent.__studioEditorWasm : undefined;
        if (warm instanceof Promise) module = await warm;
      } catch {
        // The host's warm-up died; boot our own copy.
      }
      if (!module) {
        // Compile once: the page and its render workers instantiate the same module.
        const wasmUrl = new URL("effectcraft_web_bg.wasm", location.href);
        say("Downloading Studio…");
        try {
          module = await WebAssembly.compileStreaming(fetch(wasmUrl));
        } catch {
          module = await WebAssembly.compile(await (await fetch(wasmUrl)).arrayBuffer());
        }
      }
      window.effectcraftModule = module;
      say("Starting Studio…");
      await init({ module_or_path: module });
      window.effectcraftLoad.wasmMs = performance.now() - t0;
      await ec.start("effectcraft_canvas");
      window.effectcraftLoad.readyMs = performance.now() - t0;
    } catch (e) {
      const s = document.getElementById("status");
      // A pre-flight failure keeps its plain-language message and status text;
      // everything else keeps the original stack trace.
      if (s && !window.effectcraftLoad.error) {
        s.className = "err";
        s.textContent = "Studio failed to start:\n" + (e && e.stack || e);
      }
      window.effectcraftLoad.error = window.effectcraftLoad.error ?? String(e);
      throw e;
    }
  </script>
</body>
</html>
