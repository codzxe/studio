# Dependabot — spec §16.1 ("enable Dependabot + private vulnerability reporting").
# Keep updates weekly + direct-only so the 2-person fleet can review them in one sitting.
version: 2
updates:
  # npm — root manifest (direct dependencies only; transitive deps are pinned by
  # the lockfile and surface through the weekly lockfile refresh).
  # TODO(W1-M): pnpm workspaces need one entry per package dir (apps/*, packages/*)
  # once per-package dependencies stabilize; root-only for now, per task W1-M.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    reviewers:
      - "codzxe"
    labels:
      - "dependencies"
    # §16 policy reminder: AGPL/SSPL/BUSL/RSALv2/Elastic deps fail the
    # license gate (scripts/check-licenses.mjs, run via pnpm check:licenses)
    # even if Dependabot proposes them. No GitHub Actions workflows exist in
    # .github/workflows yet (W5-08 removed the inert github-actions stanza;
    # re-add it when CI workflows land).
