# Dependabot — spec §16.1 ("enable Dependabot + private vulnerability reporting").
#
# Round 5: per-workspace coverage (the W1-M TODO) — every pnpm workspace
# manifest gets its own entry so a dependency used by SEVERAL apps/packages is
# proposed against each manifest that declares it, and grouped updates keep
# the PR queue reviewable in one sitting. All entries share the single root
# pnpm-lock.yaml; grouped bumps + the PR limit keep lockfile conflicts rare.
#
# §16 policy reminder: AGPL/SSPL/BUSL/RSALv2/Elastic deps fail the license
# gate (scripts/check-licenses.mjs, run via pnpm check:licenses) even if
# Dependabot proposes them — the gate is the final arbiter, not this file.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    reviewers:
      - "codzxe"
    labels:
      - "dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

